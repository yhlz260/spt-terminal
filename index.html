// ===== 交互 =====
/* ===== P0 升级（2026-09-11）：①信号仲裁唯一状态 ②真实交易纪律审计 ===== */
function arbitrate(c){
  if(!c||!c.code) return null;
  var now=parseFloat(c.now); if(isNaN(now)) return null;
  var br=parseBuyRange(c.buy);
  var stop=parseFloat(c.stop), target=parseFloat(String(c.target).split('→')[0]);
  var pos60=parseFloat(c.pos60); if(isNaN(pos60)) pos60=50;
  var cci=parseFloat((c.ind&&c.ind.cci)!=null?c.ind.cci:c.cci); if(isNaN(cci)) cci=0;
  var kdj=parseFloat((c.ind&&c.ind.kdj)!=null?c.ind.kdj:c.kdj); if(isNaN(kdj)) kdj=50;
  var vr=parseFloat(c.vr); if(isNaN(vr)) vr=1;
  var chg=parseFloat(c.chg); if(isNaN(chg)) chg=0;
  var ma20=parseFloat(c.ma20), ma60=parseFloat(c.ma60);
  var vg=c.vg||null;
  // ① 止损离场（最高优先级：到止损无条件执行）
  if(!isNaN(stop)&&stop>0&&now<=stop) return {st:'离场·破止损',cls:'sell',reason:'现价 '+now.toFixed(2)+' ≤ 止损 '+stop.toFixed(2)+'，纪律无条件执行，不摊平不等回本'};
  // ② 逃顶压制（第二优先级：位置+高位指标回落，压制一切买入信号）
  var esc=(pos60>=70&&cci>150&&chg<0)||(pos60>=60&&kdj>85&&chg<0);
  if(esc) return {st:'减仓·逃顶压制',cls:'sell',reason:'60日位置 '+pos60.toFixed(0)+'% 高位 + '+(cci>150?('CCI'+cci.toFixed(0)):('KDJ'+kdj.toFixed(0)))+' 高位回落，逃顶信号优先于买入信号'};
  // ③ 止盈区（不贪最后一口）
  if(!isNaN(target)&&target>0&&now>=target*0.97) return {st:'止盈区',cls:'warn',reason:'现价接近目标 '+target.toFixed(2)+'，分批止盈或持有'};
  // ④ 买入信号共振（低吸/多头/超卖/Vegas/量能）
  var inBuy=br&&br.lo>0&&now>=br.lo*0.98&&now<=br.hi*1.03;
  var bull=!isNaN(ma20)&&!isNaN(ma60)&&ma20>ma60&&now>ma20;
  var oversell=cci<-100||kdj<20;
  var trend=vg&&(vg.st==='multi'||vg.st==='cross');
  var vol=vr>1.5;
  var res=0, rsn=[];
  if(inBuy){res++;rsn.push('低吸位'+c.buy);}
  if(bull){res++;rsn.push('均线多头');}
  if(oversell){res++;rsn.push('超卖回踩');}
  if(trend){res++;rsn.push('Vegas趋势');}
  if(vol){res++;rsn.push('量能活跃');}
  if(res>=3) return {st:'可低吸',cls:'buy',reason:rsn.join(' + ')+'（共振'+res+'项）'};
  if(res===2) return {st:'关注',cls:'acc',reason:rsn.join(' + ')+'（共振'+res+'项）'};
  if(inBuy) return {st:'低吸区',cls:'acc',reason:'现价在买入区间 '+c.buy+' 内'};
  return {st:'观望',cls:'wait',reason:'信号不足，等待右侧确认'};

function loadTrades(){
  try{var raw=localStorage.getItem(TRADE_KEY); if(raw){var t=JSON.parse(raw); if(Array.isArray(t)&&t.length) return t;} }catch(e){}
  var t=SEED_TRADES.slice(); try{localStorage.setItem(TRADE_KEY,JSON.stringify(t));}catch(e){}

function calcPositions(trades){
  var pos={}, order=[];
  trades.forEach(function(t){
    if(!pos[t.code]){ pos[t.code]={code:t.code,name:t.name,cost:0,shares:0,buyAmt:0,pos60:t.pos60,pool:t.pool}; order.push(t.code); }
    var p=pos[t.code];
    if(t.side==='buy'){ p.buyAmt+=t.price*(t.shares||1); p.shares+=(t.shares||1); }
    else if(t.side==='sell'){ p.shares-=(t.shares||1); if(p.shares<=0){p.shares=0;p.buyAmt=0;} }
    if(p.shares>0) p.cost=p.buyAmt/p.shares;
  });
  return order.map(function(code){ var p=pos[code]; return p.shares>0?p:null; }).filter(Boolean);
}
function discAudit(trades,pos){
  var buys=trades.filter(function(t){return t.side==='buy';});
  var sells=trades.filter(function(t){return t.side==='sell';});
  var chase=buys.filter(function(t){return parseFloat(t.pos60)>70;}).length;
  var chaseRate=buys.length?Math.round(chase/buys.length*100):0;
  var wins=sells.filter(function(t){return t.gain>0;}).length;
  var winRate=sells.length?Math.round(wins/sells.length*100):0;
  var gains=sells.filter(function(t){return t.gain>0;}).map(function(t){return t.gain;});
  var losses=sells.filter(function(t){return t.gain<=0;}).map(function(t){return t.gain;});
  var avgWin=gains.length?gains.reduce(function(a,b){return a+b;},0)/gains.length:0;
  var avgLoss=losses.length?Math.abs(losses.reduce(function(a,b){return a+b;},0)/losses.length):0;
  var pl=avgLoss>0?avgWin/avgLoss:(avgWin>0?3:0);
  var over8=pos.filter(function(p){return p.flLoss>8;}).length;
  var near=pos.filter(function(p){return p.flLoss>=5&&p.flLoss<=8;}).length;
  var noReason=buys.filter(function(t){return !t.reason;}).length;
  var score=Math.max(0,Math.min(100,Math.round(100-chase*15-over8*10-near*5-noReason*5)));
  return {chase:chase,chaseRate:chaseRate,winRate:winRate,pl:pl,over8:over8,near:near,score:score,total:trades.length,buys:buys.length,sells:sells.length};
}

      else { state.positions=(state.positions||[]).filter(function(x){ return x!==sp; }); _posMsg='；已清空该持仓'; }
    }

// ===== 统一标的索引 + 买点解析（2026-09-15 新增）=====
// 「买入」原来只查 TIERS 三层 + 7 个因子池，波段池 / 远东风控池点「买入」会**静默 return**（没任何提示）。
// 这里统一收口成一份索引，任何页面、任何池都能查到，并带上所属池名。
function pAnyNum(v){ var n=parseFloat(v); return isFinite(n)?n:null; }
function stockUniverse(){
  var out=[], seen={};
  function push(arr, pool, tier){
    (arr||[]).forEach(function(c){
      if(!c || !c.code || seen[c.code]) return;
      seen[c.code]=1;
      out.push(Object.assign({}, c, {_pool:pool, _tier:tier||''}));
    });
  }
  try{ push(TIERS.mid,'中长线','mid'); push(TIERS.swing,'波段','swing'); push(TIERS.short,'短线','short'); }catch(e){}
  try{ push(SWING_POOL,'波段池','swing'); }catch(e){}
  try{ push(FAREAST_POOL,'远东风控池','mid'); }catch(e){}
  try{ push(DIVIDEND_POOL,'红利低波','mid'); }catch(e){}
  try{ push(SMALLCAP_POOL,'小市值','short'); }catch(e){}
  try{ push(NZI_POOL,'N字池','swing'); }catch(e){}
  try{ push(CCI_POOL,'CCI池','swing'); }catch(e){}
  try{ push(ADX_POOL,'ADX池','swing'); }catch(e){}
  try{ push(FAKEYIN_POOL,'假阴池','short'); }catch(e){}
  try{ push(ONELINE_POOL,'一阳池','short'); }catch(e){}
  (state.positions||[]).forEach(function(p){
    if(!p || !p.code || seen[p.code]) return;
    seen[p.code]=1; out.push({code:p.code, name:p.name, now:p.now, chg:p.chg, _pool:'持仓', _tier:''});
  });
  return out;
}
function findAnyStock(codeOrName){
  var s=String(codeOrName==null?'':codeOrName).trim(); if(!s) return null;
  var c6=s.replace(/[^0-9]/g,'');
  var uni=stockUniverse(), i;
  if(c6){ for(i=0;i<uni.length;i++){ if(String(uni[i].code).replace(/[^0-9]/g,'')===c6) return uni[i]; } }
  for(i=0;i<uni.length;i++){ if(uni[i].name && String(uni[i].name).indexOf(s)>=0) return uni[i]; }
  return null;
}
// 买点区间解析：兼容 数字 / '34.77-36.23' / '9.08-9.32' / plan.entry 数字
function buyZoneOf(c){
  if(!c) return null;
  var v=null;
  if(c.plan){ if(c.plan.buy!=null) v=c.plan.buy; else if(c.plan.entry!=null) v=c.plan.entry; }
  if(v==null && c.buy!=null) v=c.buy;
  if(v==null) return null;
  if(typeof v==='number') return (v>0)?{lo:v,hi:v,txt:String(v)}:null;
  var s=String(v);
  var m=s.match(/(-?\d+(?:\.\d+)?)\s*[-~—－]\s*(-?\d+(?:\.\d+)?)/);
  if(m){ var a=parseFloat(m[1]), b=parseFloat(m[2]); if(a>0&&b>0) return {lo:Math.min(a,b),hi:Math.max(a,b),txt:s}; }
  var one=parseFloat(s.replace(/[^0-9.]/g,''));
  return (isFinite(one)&&one>0)?{lo:one,hi:one,txt:s}:null;
}

// 买入：建仓（state.positions）+ 写交易流水（纪律审计）+ 记推荐账本（推荐跟踪）
// 2026-09-15 修复三个叠在一起的 bug：
//  ① 原来读 c.plan.entry，但 TIERS 原始对象**没有 plan 字段** → 抛 TypeError，点「买入」完全没反应；
//  ② 查池只覆盖 TIERS + 7 个因子池 → 波段池 / 远东风控池点「买入」静默 return（无提示）；
//  ③ 不写推荐账本；而 tiers 行内的 onclick=recordRecommendation 又被 bind() 里
//     `[data-buy]` 的 `b.onclick=...` 整段覆盖（给 onclick 赋字符串会替换行内属性）→「推荐跟踪」永远为空。
function buyStock(code, shares){
  var c=findAnyStock(code);
  if(!c){ toast('未找到标的「'+code+'」；可到「纪律审计」页用「＋新增持仓」手动录入'); return; }
  var now=pAnyNum(c.now);
  if(!(now>0)) now=pAnyNum(c.close);
  if(!(now>0)){ toast((c.name||code)+' 现价未知，无法建仓'); return; }
  var n=pAnyNum(shares); if(!(n>0)) n=1000;
  var zone=buyZoneOf(c);

  var existed=(state.positions||[]).filter(function(x){ return x.code===c.code; })[0];
  if(existed){
    toast((c.name||code)+' 已在持仓中（'+existed.shares+' 股 @'+existed.cost+'）；可在「纪律审计」页调整');
  } else {
    var chg=pAnyNum(c.chg); if(chg==null) chg=0;
    state.positions=state.positions||[];
    state.positions.push({
      code:c.code, name:c.name, cost:now, shares:n, now:now, chg:chg,
      prevClose: now/(1+chg/100), ind:c.ind||c.indicators||{}, pool:c._pool||'持仓'
    });
    // 同步写交易流水 → 纪律审计页的持仓 / 流水 / 纪律评分一起更新
    //（此前两套数据完全不通：买入只进 state.positions，纪律审计页看不到）
    try{
      var tr=loadTrades();
      tr.push({d:ymdNow(), code:c.code, name:c.name, side:'buy', price:now, shares:n,
        pos60:(pAnyNum(c.pos60)!=null?pAnyNum(c.pos60):pAnyNum(c.p60)),
        pool:c._pool||'买入', reason:'「买入」按钮建仓'+(zone?(' · 买点'+zone.txt):'')});
      saveTrades(tr);
    }catch(e){}
  }
  // 记推荐账本（已在持仓也记一次，便于跟踪该推荐后续表现）
  try{
    recordRecommendation(c.code, c.name, now,
      (c.theme? String(c.theme).split(/[·,，\/]/).filter(Boolean):[]),
      c._pool||'', c._tier||'');
  }catch(e){}

  save(); render();
  var msg=(existed?'已在持仓：':'已买入 ')+(c.name||code)+'  '+now.toFixed(2)+' × '+n+' 股';
  if(zone){
    msg+=' ｜ 买点 '+zone.txt;
    if(now>zone.hi) msg+='（现价已高于买点上沿，注意别追高）';
    else if(now<zone.lo) msg+='（现价低于买点下沿，可等企稳确认）';
  }
  toast(msg);
}

// ===== 持仓备份：导出/导入 JSON（跨链接、跨设备恢复，解决换链接丢失）=====
function exportState(){
  const data = {positions:state.positions, realSetting:state.realSetting, sim:state.sim, savedAt:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spt持仓备份_'+MARKET.date.replace(/-/g,'')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast('已导出备份：'+state.positions.length+' 只持仓 + 模拟仓');
}
function importStateFile(file){
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d!=='object') throw new Error('bad');
      if(Array.isArray(d.positions)) state.positions = d.positions;
      if(d.realSetting && typeof d.realSetting==='object') state.realSetting = Object.assign({principal:0,principalSet:false}, d.realSetting);
      if(d.sim && typeof d.sim==='object') state.sim = Object.assign(state.sim, d.sim);
      save(); render();
      toast('已导入备份：'+state.positions.length+' 只持仓，本金 '+((state.realSetting.principalSet?state.realSetting.principal:0)/10000).toFixed(2)+'万');
    }catch(e){
      toast('备份文件解析失败，请确认是导出的 JSON 文件');
    }
  };
  fr.readAsText(file);
}
function bindExportImport(){
  const ex = document.getElementById('exportState');
  if(ex) ex.onclick = function(){ exportState(); };
  const im = document.getElementById('importState');
  if(im) im.onclick = function(){ document.getElementById('importFile').click(); };
  const ex2 = document.getElementById('exportStateSim');
  if(ex2) ex2.onclick = function(){ exportState(); };
  const im2 = document.getElementById('importStateSim');
  if(im2) im2.onclick = function(){ document.getElementById('importFile').click(); };
  const f = document.getElementById('importFile');
  if(f) f.onchange = function(e){ if(e.target.files && e.target.files[0]) importStateFile(e.target.files[0]); e.target.value=''; };
}

  document.getElementById('labelA').textContent = labelA;
  document.getElementById('labelB').textContent = labelB;

  setTimeout(()=>document.getElementById('modalInputA').focus(),50);
}
function closeMaskModal(){ document.getElementById('modalMask').classList.remove('show'); modalCtx=null; }
function initModal(){
  document.getElementById('modalCancel').onclick = closeMaskModal;
  document.getElementById('modalMask').onclick = (e)=>{ if(e.target.id==='modalMask') closeMaskModal(); };
  document.getElementById('modalOk').onclick = ()=>{

    modalCtx(

      parseFloat(document.getElementById('modalInputB').value)
    );
    closeMaskModal();
  };
}

   规则：信号触发「次日开盘」买入；持有期内 跌破 MA20×0.95 止损 / MACD 死叉止盈 / 到期平仓。 */

// --- 日K多源容灾 ---
// 实测（本机/公司网络出口）：web.ifzq.gtimg.cn/appstock/app/fqkline/get 与 push2his eastmoney /kline/get
// 会在 30~120ms 内被网络设备直接 RST（fetch: "Failed to fetch"）；而 ifzq.gtimg.cn（注意：无 web. 前缀）
// 的 fqkline/get、以及 web.ifzq.gtimg.cn/appstock/app/kline/kline 可正常返回。
// 故主源改用 ifzq.gtimg.cn（前复权 qfq），东财作次源，不复权接口作最后兜底。
async function _btFetchJSON(url, times, gap){
  var lastErr, n = times || 2;
  for(var t=0;t<n;t++){
    try{
      var r = await fetch(url);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    }catch(e){ lastErr = e; if(t < n-1) await new Promise(function(s){ setTimeout(s, gap||400); }); }
  }
  throw lastErr;
}
function _btMapRows(rows){
  return (rows||[]).map(function(p){
    return {day:p[0], open:+p[1], close:+p[2], high:+p[3], low:+p[4], volume:+p[5]};
  }).filter(function(k){ return !isNaN(k.close); });
}
// 腾讯前复权（主源）：qfqday = [date, open, close, high, low, volume(手)]
// 实测本机：ifzq.gtimg.cn / push2his eastmoney 的 kline 路径时通时不通（被网络设备 RST），
// 而 proxy.finance.qq.com 的 CDN 镜像稳定返回 qfqday，故列为首选。
function _txParseKline(json, t){
  var node = json && json.data && json.data[t];
  var rows = node && (node.qfqday || node.day);
  if(!Array.isArray(rows) || !rows.length) throw new Error('日K为空');
  return _btMapRows(rows);
}

var BT_SRC = { last: '', errs: [] };
async function fetchBTKline(code, lmt){
  var chain = [
    ['腾讯前复权(CDN)', fetchTencentKline],
    ['腾讯前复权(ifzq)', fetchTencentIfzqKline],
    ['东财前复权', fetchEmKline],
    ['腾讯不复权(兜底)', fetchTencentRawKline],
  ];
  var errs = [];
  for(var i=0;i<chain.length;i++){
    try{
      var bars = await chain[i][1](code, lmt);
      BT_SRC.last = chain[i][0];
      return bars;
    }catch(e){ errs.push(chain[i][0] + ':' + (e && e.message ? e.message : e)); }
  }
  BT_SRC.errs = errs;
  throw new Error('四路K线源均不可用 → ' + errs.join(' ｜ '));
}

function _btMA(arr, period){
  var out = new Array(arr.length).fill(null);
  for(var i=period-1;i<arr.length;i++){ var s=0; for(var j=i-period+1;j<=i;j++) s+=arr[j]; out[i]=s/period; }
  return out;
}
function _btEMA(arr, period){
  var k = 2/(period+1), out = [arr[0]], prev = arr[0];
  for(var i=1;i<arr.length;i++){ prev = arr[i]*k + prev*(1-k); out.push(prev); }
  return out;
}
function _btRSI(closes, period){
  var out = new Array(closes.length).fill(null);
  for(var i=period;i<closes.length;i++){
    var g=0, l=0;
    for(var j=i-period+1;j<=i;j++){ var d=closes[j]-closes[j-1]; if(d>0) g+=d; else l-=d; }
    out[i] = l===0 ? 100 : 100 - 100/(1+g/l);
  }
  return out;
}
// 涨=红(--up) 跌=绿(--down)，符合 A 股习惯
function _btPct(x){ return (x>=0?'+':'') + x.toFixed(2) + '%'; }
function _btColor(x){ return x>0?'var(--up)':(x<0?'var(--down)':'var(--text2)'); }

/* ============ 回测设置（散户版体检口径）============
   cost      : 一次完整往返成本（%），佣金+印花税+冲击成本
   skipLimit : 次日开盘即封涨停 → 视为买不到，跳过该信号
   rho       : 同时持仓之间的收益相关系数（保守取 0.35），用于折算有效独立样本 */
var BTCFG = { cost: 0.30, skipLimit: true, rho: 0.35, bench: 'sh000300', benchName: '沪深300' };
function _btReadCfg(){
  var c = document.getElementById('btCostSel');  if(c) BTCFG.cost = +c.value;
  var l = document.getElementById('btLimitChk'); if(l) BTCFG.skipLimit = !!l.checked;
  return BTCFG;
}
// 涨跌停幅度（按板块）
function _btLimitPct(code){
  var c = String(code).replace(/\D/g,'');
  if(/^(300|301)/.test(c)) return 0.20;            // 创业板
  if(/^(688|689)/.test(c)) return 0.20;            // 科创板
  if(/^(43|83|87|88|920)/.test(c)) return 0.30;    // 北交所
  return 0.10;                                     // 沪深主板
}
// 标准正态 CDF 的 erf 近似（Abramowitz & Stegun 7.1.26，误差 <1.5e-7）
function _btErf(x){
  var s = x<0?-1:1; x = Math.abs(x);
  var t = 1/(1+0.3275911*x);
  var y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
function _btTwoSidedP(t){ return Math.max(0, Math.min(1, 1 - _btErf(Math.abs(t)/Math.SQRT2))); }

// 单组收益序列的统计检验
function _btStats(rets, overlapM){
  var n = rets.length;
  if(!n) return null;
  var mean = rets.reduce(function(a,b){return a+b;},0)/n;
  var ss = rets.reduce(function(a,b){return a+(b-mean)*(b-mean);},0);
  var sd = Math.sqrt(ss/(n>1?n-1:1));
  var se = sd/Math.sqrt(n);
  var t = se? mean/se : 0;
  var p = _btTwoSidedP(t);
  var m = Math.max(1, overlapM||1);
  var nEff = Math.max(2, Math.round(n/(1+(m-1)*BTCFG.rho)));
  var tEff = (sd/Math.sqrt(nEff))? mean/(sd/Math.sqrt(nEff)) : 0;
  return {
    n:n, mean:mean, sd:sd, se:se, t:t, p:p,
    lo:mean-1.96*se, hi:mean+1.96*se,
    m:m, nEff:nEff, tEff:tEff, pEff:_btTwoSidedP(tEff)
  };
}

/* ============ 组合净值曲线 ============
   规则：每个交易日把资金「等权」分配给当天所有在场持仓（空仓日收益记为 0）。
   逐日 mark-to-market：开仓日以次日开盘价为基准，之后按当日收盘价走，平仓日一次性扣往返成本。
   这是把「一堆独立信号」变成「一条账户净值曲线」的最小可行做法，也是判断 alpha 的前提。 */
function buildEquity(trades, btBars, cost){
  if(!trades || !trades.length || !btBars) return null;
  var codes = Object.keys(btBars);
  if(!codes.length) return null;
  var daySet = {};
  codes.forEach(function(c){ (btBars[c]||[]).forEach(function(b){ daySet[b.day]=1; }); });
  var days = Object.keys(daySet).sort();
  if(days.length < 30) return null;
  var di = {}; days.forEach(function(d,k){ di[d]=k; });
  var closeM = {}, idxM = {};
  codes.forEach(function(c){
    var b = btBars[c], m = {}, x = {};
    for(var i=0;i<b.length;i++){ m[b[i].day] = b[i].close; x[b[i].day] = i; }
    closeM[c] = m; idxM[c] = x;
  });
  var sum = new Array(days.length).fill(0), cnt = new Array(days.length).fill(0);
  var bad = 0;
  trades.forEach(function(t){
    var b = btBars[t.code]; if(!b) return;
    var x = idxM[t.code]; if(!x) return;
    var i0 = x[t.date], i1 = x[t.exitDate];
    if(i0==null || i1==null || i1<i0) { bad++; return; }
    var prev = t.entry;                       // 开仓基准 = 入场日开盘价
    for(var i=i0;i<=i1;i++){
      var k = di[b[i].day]; if(k==null) continue;
      var r = (b[i].close - prev)/prev;
      prev = b[i].close;
      if(i===i1) r -= cost/100;                // 平仓日一次性扣往返成本
      sum[k] += r; cnt[k] += 1;
    }
  });
  var eq = [1], daily = [], posCnt = [];
  for(var k=0;k<days.length;k++){
    var pc = cnt[k]||0, pr = pc? sum[k]/pc : 0;
    daily.push(pr); posCnt.push(pc);
    if(k===0) eq[0] = 1+pr; else eq.push(eq[k-1]*(1+pr));
  }
  var N = days.length, cum = eq[eq.length-1]-1;
  var yrs = N/252;
  var ann = yrs>0 ? Math.pow(1+cum, 1/yrs)-1 : 0;
  var mu = daily.reduce(function(a,b){return a+b;},0)/daily.length;
  var sd = Math.sqrt(daily.reduce(function(a,b){return a+(b-mu)*(b-mu);},0)/(daily.length>1?daily.length-1:1));
  var sharpe = sd? (mu/sd)*Math.sqrt(252) : 0;
  var peak = eq[0], mdd = 0, mddDay = '', mddPeakDay = '';
  for(var i=0;i<eq.length;i++){
    if(eq[i]>peak){ peak = eq[i]; }
    var dd = (eq[i]-peak)/peak;
    if(dd < mdd){ mdd = dd; mddDay = days[i]; }
  }
  var calmar = mdd<0 ? ann/Math.abs(mdd) : 0;
  var dayWin = daily.filter(function(x){ return x>0; }).length/daily.length;
  var avgPos = posCnt.reduce(function(a,b){return a+b;},0)/posCnt.length;
  return {
    days:days, eq:eq, daily:daily, posCnt:posCnt,
    cum:cum, ann:ann, vol:sd*Math.sqrt(252), sharpe:sharpe,
    mdd:mdd, mddDay:mddDay, calmar:calmar, dayWin:dayWin, avgPos:avgPos,
    fired:cnt.reduce(function(a,b){return a+b;},0), badTrade:bad, N:N
  };
}

// 同期基准（默认沪深300）：同窗口累计收益与最大回撤
function buildBench(bars, startDay, endDay){
  if(!bars || !bars.length) return null;
  var seg = bars.filter(function(b){ return b.day>=startDay && b.day<=endDay; });
  if(seg.length < 5) return null;
  var first = seg[0].close, last = seg[seg.length-1].close;
  var peak = first, mdd = 0;
  seg.forEach(function(b){ if(b.close>peak) peak=b.close; var dd=(b.close-peak)/peak; if(dd<mdd) mdd=dd; });
  var cum = last/first - 1;
  var yrs = seg.length/252;
  return { name:BTCFG.benchName, cum:cum, mdd:mdd, ann: yrs>0?Math.pow(1+cum,1/yrs)-1:0, n:seg.length, code:BTCFG.bench };
}

// 双序列净值图（纯内联 SVG，不依赖外部图表库）
function _btSpark(strat, bench, w, h){
  if(!strat || strat.length<2) return '';
  w = w||640; h = h||190;
  var lo = Math.min.apply(null, strat), hi = Math.max.apply(null, strat);
  if(bench && bench.length){
    lo = Math.min(lo, Math.min.apply(null, bench));
    hi = Math.max(hi, Math.max.apply(null, bench));
  }
  lo = Math.min(lo, 1); hi = Math.max(hi, 1);
  var pad = (hi-lo)*0.10 || 0.02; lo -= pad; hi += pad;
  var n = strat.length;
  var X = function(i){ return (i/(n-1))*w; };
  var Y = function(v){ return h - ((v-lo)/(hi-lo))*h; };
  function path(series){
    if(!series) return '';
    var m = series.length;
    return series.map(function(v,i){ return (i?'L':'M') + (i/(m-1)*w).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
  }
  var pS = path(strat), pB = path(bench);
  var area = pS + ' L ' + w + ' ' + h + ' L 0 ' + h + ' Z';
  var yBase = Y(1).toFixed(1);
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px;display:block;">'
    + '<defs><linearGradient id="btEqG" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#e04848" stop-opacity="0.26"/><stop offset="100%" stop-color="#e04848" stop-opacity="0"/></linearGradient></defs>'
    + '<line x1="0" y1="'+yBase+'" x2="'+w+'" y2="'+yBase+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>'
    + '<path d="'+area+'" fill="url(#btEqG)"/>'
    + (pB? '<path d="'+pB+'" fill="none" stroke="#8a93a6" stroke-width="1.6" stroke-dasharray="5 4"/>' : '')
    + '<path d="'+pS+'" fill="none" stroke="#e04848" stroke-width="2.2"/>'
    + '</svg>';
}

// 对单只股票回放 5 类信号，返回 {trades, bars, skipped}
// 单参数回放：从 backtestStock 里抽出来，便于 walk-forward 在同一批 bars 上换 holdDays 重跑（不重新取数）。
function btSimulate(code, name, bars, holdDays, cfg){
  cfg = cfg || BTCFG;
  {
    var n = bars ? bars.length : 0;
    if(n < 140) return {trades:[], skipped:0, short:true};
    var skipped = 0;
    var closes = bars.map(function(b){ return b.close; });
    var ma5=_btMA(closes,5), ma10=_btMA(closes,10), ma20=_btMA(closes,20);
    var e12=_btEMA(closes,12), e26=_btEMA(closes,26), difArr=[];
    for(var z=0;z<n;z++) difArr.push(e12[z]-e26[z]);
    var deaArr = _btEMA(difArr, 9);
    var rsi = _btRSI(closes, 14);
    var trades = [];
    var lastFire = {B1:-99,B2:-99,B3:-99,B4:-99,B5:-99};

    for(var i=120; i<n-2; i++){
      if(ma20[i]==null || ma20[i-3]==null) continue;
      var entryBar = i+1;
      if(entryBar >= n) break;
      var vol20 = 0;
      for(var v=i-19;v<=i;v++) vol20 += bars[v].volume;
      vol20 /= 20;
      var hi60 = -Infinity;
      for(var h=i-59;h<=i;h++){ if(closes[h]>hi60) hi60=closes[h]; }

      var fire = null;
      if(difArr[i-1]<=deaArr[i-1] && difArr[i]>deaArr[i]) fire='B1';
      else if(closes[i-1]<=ma20[i-1] && closes[i]>ma20[i] && ma20[i]>ma20[i-3]) fire='B2';
      else if(ma5[i]>ma10[i] && ma10[i]>ma20[i] && bars[i].low<=ma20[i]*1.02 && closes[i]>ma20[i]) fire='B3';
      else if(rsi[i-1]!=null && rsi[i]!=null && rsi[i-1]<30 && rsi[i]>=30) fire='B4';
      else if(closes[i]>=hi60*0.999 && vol20>0 && bars[i].volume>=1.5*vol20) fire='B5';
      if(!fire) continue;
      if(i - lastFire[fire] < holdDays) continue;   // 同信号冷却去重
      lastFire[fire] = i;

      var entry = bars[entryBar].open;
      if(!isFinite(entry) || entry<=0) continue;
      // 涨跌停约束：次日开盘即封涨停 → 实际买不到，跳过该信号（不产生交易）
      var lim = _btLimitPct(code);
      if(cfg.skipLimit && entry >= closes[i]*(1+lim) - 0.005){ skipped++; continue; }
      var endJ = Math.min(entryBar + holdDays, n-1);
      var exit = closes[endJ], exitJ = endJ, reason = '到期';
      for(var j=entryBar+1; j<=endJ; j++){
        if(ma20[j]!=null && closes[j] < ma20[j]*0.95){ exit=closes[j]; exitJ=j; reason='🛑止损'; break; }
        if(difArr[j-1]>=deaArr[j-1] && difArr[j]<deaArr[j]){ exit=closes[j]; exitJ=j; reason='✂️死叉止盈'; break; }
      }
      trades.push({
        code:code, name:name, sig:fire,
        sigName: (BT_SIGNALS.filter(function(s){return s.id===fire;})[0]||{}).name || fire,
        date:bars[entryBar].day, exitDate:bars[exitJ].day,
        entry:+entry.toFixed(2), exit:+exit.toFixed(2),
        retG:+(((exit-entry)/entry)*100).toFixed(2),
        ret:+((((exit-entry)/entry)*100) - (cfg.cost||0)).toFixed(2),
        hold:exitJ-entryBar, reason:reason
      });
    }
    return {trades:trades, skipped:skipped, short:false};
  }
}
// 单只回测：取数 + 回放 → {trades, bars, skipped}
function backtestStock(code, name, holdDays, cfg){
  return fetchBTKline(code, 400).then(function(bars){
    var r = btSimulate(code, name, bars, holdDays, cfg);
    if(r.short) throw new Error('K线样本不足（'+bars.length+' 根 < 140）');
    return {trades:r.trades, bars:bars, skipped:r.skipped};
  });
}

// 聚合统计（按信号类型）
function aggregateTrades(allTrades){
  var stats = {};
  BT_SIGNALS.forEach(function(s){ stats[s.id] = {id:s.id, name:s.name, desc:s.desc, n:0, wins:0, sum:0, sumG:0, rets:[], winSum:0, lossSum:0, holdSum:0, worst:0, best:0, dates:[]}; });
  allTrades.forEach(function(t){
    var st = stats[t.sig]; if(!st) return;
    st.n++; st.sum += t.ret; st.sumG += (t.retG!=null ? t.retG : t.ret); st.rets.push(t.ret); st.holdSum += (t.hold||0);
    if(t.ret > 0){ st.wins++; st.winSum += t.ret; } else { st.lossSum += Math.abs(t.ret); }
    if(t.ret < st.worst) st.worst = t.ret;
    if(t.ret > st.best) st.best = t.ret;
    st.dates.push(t.date);
  });
  return stats;
}

/* ==================================================================================
   机构级验证与风控工具箱（2026-09-14）
   机构与散户的差别不在"指标数量"，而在五件事：
     ① 敢不敢做样本外（而不只是全样本好看）
     ② 会不会为"试了很多次"打折扣（多重检验 / Deflated Sharpe）
     ③ 能不能把收益拆成 alpha 与 beta（跑赢指数的是本事还是行情）
     ④ 仓位是按风险给还是按感觉给（波动率目标化）
     ⑤ 有没有写清楚这套工具做不到什么（局限声明）
   下面按这五条实现。全部用本次回测已产出的数据现算，不引任何外部库。
   ================================================================================== */

// ---------- 正态 CDF / 逆 CDF（Acklam 有理逼近） ----------
function _btNormCdf(x){ return 0.5*(1+_btErf(x/Math.SQRT2)); }
function _btNormInv(p){
  if(!(p>0)) return -Infinity;
  if(p>=1) return Infinity;
  var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  var b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  var c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  var d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  var pl=0.02425, q, r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=1-pl){ q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}

// ---------- 矩：均值 / 样本标准差 / 偏度 / 超额峰度 ----------
function _btMoments(a){
  var n=a?a.length:0; if(n<3) return null;
  var m=0,i; for(i=0;i<n;i++) m+=a[i]; m/=n;
  var s2=0,s3=0,s4=0,d;
  for(i=0;i<n;i++){ d=a[i]-m; s2+=d*d; s3+=d*d*d; s4+=d*d*d*d; }
  var sd=Math.sqrt(s2/(n-1)), m2=s2/n;
  if(!(m2>0)) return {mean:m, sd:sd, skew:0, kurt:0, n:n};
  return {mean:m, sd:sd, skew:(s3/n)/Math.pow(m2,1.5), kurt:(s4/n)/(m2*m2)-3, n:n};
}

// ---------- 回撤明细（按深度取前 N）：到谷天数 / 修复天数 ----------
function _btDrawdowns(days, eqArr, topN){
  if(!days||!eqArr||eqArr.length<3) return [];
  var out=[], peak=eqArr[0], peakI=0, cur=null, i, dd;
  for(i=1;i<eqArr.length;i++){
    if(eqArr[i]>=peak){
      if(cur){ cur.recoverDay=days[i]; cur.recoverLen=i-cur.troughI; out.push(cur); cur=null; }
      peak=eqArr[i]; peakI=i;
    } else {
      dd=(eqArr[i]-peak)/peak;
      if(!cur) cur={depth:dd, peakDay:days[peakI], peakI:peakI, troughDay:days[i], troughI:i};
      else if(dd<cur.depth){ cur.depth=dd; cur.troughDay=days[i]; cur.troughI=i; }
    }
  }
  if(cur) out.push(cur);
  out.sort(function(x,y){ return x.depth-y.depth; });
  return out.slice(0, topN||5).map(function(x){
    return {depth:x.depth, peakDay:x.peakDay, troughDay:x.troughDay, recoverDay:x.recoverDay||null,
            toTrough:x.troughI-x.peakI, fromTrough:(x.recoverLen!=null?x.recoverLen:null)};
  });
}

// ---------- 风险与尾部指标（基于日收益序列） ----------
function _btRiskRatios(daily){
  var n=daily?daily.length:0; if(n<20) return null;
  var mo=_btMoments(daily), i;
  var down=daily.filter(function(x){ return x<0; });
  var dsd = down.length? Math.sqrt(down.reduce(function(a,b){ return a+b*b; },0)/down.length) : 0;
  var sortino = dsd? (mo.mean/dsd)*Math.sqrt(252) : 0;
  var gw=0, gl=0;
  daily.forEach(function(x){ if(x>0) gw+=x; else gl+=-x; });
  var omega = gl>0? gw/gl : (gw>0?99:0);
  var e=1, peak=1, ui=0, e2;
  for(i=0;i<n;i++){ e*=(1+daily[i]); if(e>peak) peak=e; e2=(e-peak)/peak; if(e2<0 || e2>0) ui+=e2*e2; }
  var ulcer=Math.sqrt(ui/n);
  var sorted=daily.slice().sort(function(a,b){ return a-b; });
  function q(p){ var idx=(n-1)*p, lo=Math.floor(idx), hi=Math.ceil(idx); return lo===hi? sorted[lo] : sorted[lo]+(sorted[hi]-sorted[lo])*(idx-lo); }
  function tailMean(frac){ var k=Math.max(1, Math.floor(n*frac)), s=0, j; for(j=0;j<k;j++) s+=sorted[j]; return s/k; }
  var v95=q(0.05), v99=q(0.01), c95=tailMean(0.05), c99=tailMean(0.01);
  var tailRatio = q(0.05)!==0 ? Math.abs(q(0.95)/q(0.05)) : 0;
  return {n:n, mean:mo.mean, sd:mo.sd, skew:mo.skew, kurt:mo.kurt, sortino:sortino, omega:omega,
          ulcer:ulcer, var95:v95, var99:v99, cvar95:c95, cvar99:c99, tailRatio:tailRatio,
          best:sorted[n-1], worst:sorted[0]};
}

// ---------- 基准日收益（对齐策略交易日历，缺失日前值填充，不产生前视） ----------
function _btBenchDaily(eqDays){
  if(!BT_STATE.benchBars || !BT_STATE.benchBars.length) return null;
  var bm={}; BT_STATE.benchBars.forEach(function(b){ bm[b.day]=b.close; });
  var cur=null, i, lvl=eqDays.map(function(d){ if(bm[d]!=null) cur=bm[d]; return cur; });
  var out=[], prev=null;
  for(i=0;i<lvl.length;i++){
    out.push((lvl[i]==null||prev==null)? null : (lvl[i]/prev-1));
    if(lvl[i]!=null) prev=lvl[i];
  }
  return out;
}

// ---------- Alpha / Beta 回归（对基准日收益做 OLS，无风险利率取 0，已在 UI 注明） ----------
function _btAlphaBeta(daily, bdaily){
  if(!bdaily) return null;
  var xs=[], ys=[], i;
  for(i=0;i<daily.length;i++){ if(bdaily[i]==null) continue; xs.push(bdaily[i]); ys.push(daily[i]); }
  var n=xs.length; if(n<40) return null;
  var mx=0, my=0;
  for(i=0;i<n;i++){ mx+=xs[i]; my+=ys[i]; } mx/=n; my/=n;
  var sxx=0, sxy=0, syy=0, dx, dy;
  for(i=0;i<n;i++){ dx=xs[i]-mx; dy=ys[i]-my; sxx+=dx*dx; sxy+=dx*dy; syy+=dy*dy; }
  if(!(sxx>0)) return null;
  var beta=sxy/sxx, alpha=my-beta*mx;
  var ssr=0, er;
  for(i=0;i<n;i++){ er=ys[i]-(alpha+beta*xs[i]); ssr+=er*er; }
  var dof=Math.max(1,n-2), s2=ssr/dof;
  var r2 = syy>0? Math.min(1, Math.max(0, 1-ssr/syy)) : 0;
  var te = Math.sqrt(s2)*Math.sqrt(252);
  var seA = Math.sqrt(Math.max(0, s2*(1/n + mx*mx/sxx)));
  var tA = seA? alpha/seA : 0;
  var md=0, dv, vr=0;
  for(i=0;i<n;i++) md+=ys[i]-xs[i]; md/=n;
  for(i=0;i<n;i++){ dv=(ys[i]-xs[i])-md; vr+=dv*dv; }
  var sdD=Math.sqrt(vr/Math.max(1,n-1));
  var ir = sdD? (md/sdD)*Math.sqrt(252) : 0;
  var upM=0, upB=0, dnM=0, dnB=0;
  for(i=0;i<n;i++){
    if(xs[i]>0){ upM+=ys[i]; upB+=xs[i]; }
    else if(xs[i]<0){ dnM+=ys[i]; dnB+=xs[i]; }
  }
  return {n:n, alphaAnn:alpha*252, beta:beta, r2:r2, te:te, ir:ir, tAlpha:tA, pAlpha:_btTwoSidedP(tA),
          upCap:(upB!==0? upM/upB : 0), dnCap:(dnB!==0? dnM/dnB : 0),
          excessAnn:md*252, benchAnn:mx*252};
}

// ---------- 任意日收益序列的净值与指标 ----------
function _btSeriesStats(daily){
  var n=daily?daily.length:0; if(n<20) return null;
  var e=1, peak=1, mdd=0, eq=[], i, dd;
  for(i=0;i<n;i++){ e*=(1+daily[i]); eq.push(e); if(e>peak) peak=e; dd=(e-peak)/peak; if(dd<mdd) mdd=dd; }
  var mo=_btMoments(daily), yrs=n/252, cum=e-1;
  return {cum:cum, ann:(yrs>0?Math.pow(1+cum,1/yrs)-1:0), vol:mo.sd*Math.sqrt(252),
          sharpe:(mo.sd?(mo.mean/mo.sd)*Math.sqrt(252):0), mdd:mdd, eq:eq, n:n};
}

// ---------- 波动率目标化：只用 t-1 及之前的 20 日已实现波动缩放下一天的仓位（无前视） ----------
function _btVolTarget(daily, targetAnn, lookback, cap){
  lookback=lookback||20; cap=cap||2;
  var out=[], hist=[], scales=[], i, j, m, v, d, sd, sc;
  for(i=0;i<daily.length;i++){
    sc=1;
    if(hist.length>=lookback){
      m=0; for(j=0;j<hist.length;j++) m+=hist[j]; m/=hist.length;
      v=0; for(j=0;j<hist.length;j++){ d=hist[j]-m; v+=d*d; }
      sd=Math.sqrt(v/(hist.length-1));
      if(sd>0) sc=Math.min(cap, Math.max(0.2, (targetAnn/Math.sqrt(252))/sd));
    }
    out.push(daily[i]*sc); scales.push(sc);
    hist.push(daily[i]); if(hist.length>lookback) hist.shift();
  }
  return {rets:out, scales:scales, avgScale:(scales.length? scales.reduce(function(x,y){return x+y;},0)/scales.length : 1)};
}

// ---------- 时间稳定性：按日期切 K 段 / 前后半段 ----------
function _btSortByDate(tr){ return tr.slice().sort(function(a,b){ return a.date<b.date? -1 : (a.date>b.date? 1 : 0); }); }
function _btPackSeg(x){
  var r=x.map(function(t){ return t.ret; }), s=_btStats(r,1);
  return {n:x.length, mean:s?s.mean:0, t:s?s.t:0,
          win:x.length? x.filter(function(t){ return t.ret>0; }).length/x.length : 0,
          from:x.length? x[0].date : '—', to:x.length? x[x.length-1].date : '—'};
}
function _btSegments(trades, k){
  var arr=_btSortByDate(trades); if(arr.length < (k||4)*5) return null;
  var K=k||4, sz=Math.floor(arr.length/K), out=[], i, seg, p;
  for(i=0;i<K;i++){
    seg=arr.slice(i*sz, i===K-1? arr.length : (i+1)*sz);
    p=_btPackSeg(seg); p.idx=i+1; out.push(p);
  }
  return out;
}
function _btHalfSplit(trades){
  var arr=_btSortByDate(trades); if(arr.length<20) return null;
  var h=Math.floor(arr.length/2);
  return {a:_btPackSeg(arr.slice(0,h)), b:_btPackSeg(arr.slice(h))};
}

// ---------- Anchored Walk-forward：在 IS 上选持有期，在 OOS 上验证 ----------
// 这是本页唯一"真正的样本外"：参数由 IS 决定，OOS 完全不参与选择。
// 同时给出「全样本最优」作对照 —— 两者的差就是过拟合的代价。
function _btWalkForward(btBars, grid, folds, cfg, nameOf){
  var codes=Object.keys(btBars||{}).filter(function(c){ return btBars[c] && btBars[c].length>=140; });
  if(codes.length<8) return null;
  var daySet={}, i, j;
  codes.forEach(function(c){ btBars[c].forEach(function(b){ daySet[b.day]=1; }); });
  var days=Object.keys(daySet).sort();
  if(days.length<260) return null;
  var K=Math.max(2, Math.min(5, folds||4));
  var segN=Math.floor(days.length/(K+1));
  if(segN<40) return null;
  var bounds=[]; for(i=0;i<=K+1;i++) bounds.push(days[Math.min(days.length-1, i*segN)]);
  // 每个候选持有期在整段日历上跑一遍（只算一次，之后按日期切片）
  var byHold={};
  grid.forEach(function(hd){
    var tr=[], sk=0;
    codes.forEach(function(c){
      var r=btSimulate(c, (nameOf && nameOf[c])||c, btBars[c], hd, cfg);
      sk+=r.skipped;
      for(var q=0;q<r.trades.length;q++) tr.push(r.trades[q]);
    });
    byHold[hd]={trades:_btSortByDate(tr), skipped:sk};
  });
  // 同时持仓重叠度：同一段里多个信号同时在场的平均只数。
  // 不做这个折算会把「同涨同跌的一批信号」当成独立样本，p 值被严重低估。
  function _ovl(tr){ return _btOverlap(tr, btBars, cfg); }
  var foldsOut=[], pooledTr=[], isPooledTr=[], k, z;
  for(k=1;k<=K;k++){
    var isLo=bounds[0], isHi=bounds[k], oosLo=bounds[k], oosHi=bounds[k+1];
    var best=null;
    grid.forEach(function(hd){
      var tr=byHold[hd].trades.filter(function(t){ return t.date>=isLo && t.date<isHi; });
      if(tr.length<25) return;
      var s=_btStats(tr.map(function(t){ return t.ret; }),1);
      if(!s || !(s.sd>0)) return;
      var score=s.mean/s.sd;
      if(!best || score>best.score) best={hd:hd, score:score, n:tr.length, mean:s.mean};
    });
    if(!best) continue;
    var oosTr=byHold[best.hd].trades.filter(function(t){ return t.date>=oosLo && t.date<oosHi; });
    var orr=oosTr.map(function(t){ return t.ret; }), os=_btStats(orr, _ovl(oosTr));
    foldsOut.push({fold:k, hd:best.hd, isN:best.n, isMean:best.mean,
                   oosN:oosTr.length, oosMean:(os? os.mean : null),
                   oosT:(os? os.tEff : null), oosTraw:(os? os.t : null), oosM:(os? os.m : 1),
                   oosWin: oosTr.length? oosTr.filter(function(t){ return t.ret>0; }).length/oosTr.length : null,
                   from:oosLo, to:oosHi});
    for(z=0;z<oosTr.length;z++) pooledTr.push(oosTr[z]);
    var isTr=byHold[best.hd].trades.filter(function(t){ return t.date>=isLo && t.date<isHi; });
    for(z=0;z<isTr.length;z++) isPooledTr.push(isTr[z]);
  }
  if(!foldsOut.length) return null;
  var fullBest=null;
  grid.forEach(function(hd){
    var r=byHold[hd].trades.map(function(t){ return t.ret; }); if(r.length<30) return;
    var s=_btStats(r,1); if(!s) return;
    if(!fullBest || s.mean>fullBest.mean) fullBest={hd:hd, mean:s.mean, n:r.length, t:s.t};
  });
  var mPool=_ovl(pooledTr), mIs=_ovl(isPooledTr);
  return {K:K, grid:grid, folds:foldsOut, pooled:_btStats(pooledTr.map(function(t){ return t.ret; }), mPool),
          pooledN:pooledTr.length, pooledM:mPool,
          isPooled:_btStats(isPooledTr.map(function(t){ return t.ret; }), mIs), isPooledM:mIs,
          fullBest:fullBest, days:days.length, codes:codes.length};
}

// ---------- Deflated Sharpe Ratio（Bailey & López de Prado 2014） ----------
// 回答："你试了 N 种变体之后挑出来的最好那条，靠运气本来能有多高的 Sharpe？"
function _btDeflatedSharpe(daily, trialSharpes, nTrials){
  var mo=_btMoments(daily); if(!mo || !(mo.sd>0)) return null;
  var T=daily.length, sr=mo.mean/mo.sd;             // 非年化，公式要求
  var trials=(trialSharpes||[]).filter(function(x){ return isFinite(x); });
  var N=Math.max(2, Math.round(nTrials||trials.length||2));
  var v=0, i, d, mt;
  if(trials.length>1){
    mt=0; for(i=0;i<trials.length;i++) mt+=trials[i]; mt/=trials.length;
    for(i=0;i<trials.length;i++){ d=trials[i]-mt; v+=d*d; }
    v/=(trials.length-1);
  }
  var sdSR=Math.sqrt(Math.max(v,0));
  var EULER=0.5772156649015329;
  var z1=_btNormInv(1-1/N), z2=_btNormInv(1-1/(N*Math.E));
  var sr0=sdSR*((1-EULER)*z1 + EULER*z2);
  var denom=Math.sqrt(Math.max(1e-9, 1 - mo.skew*sr + ((mo.kurt+2)/4)*sr*sr));
  return {srDaily:sr, srAnn:sr*Math.sqrt(252), sr0:sr0, sdSR:sdSR, N:N,
          dsr:_btNormCdf((sr-sr0)*Math.sqrt(Math.max(1,T-1))/denom),
          skew:mo.skew, kurt:mo.kurt, T:T, trialsN:trials.length};
}

// ---------- 容量与换手：票面金额 ÷ 当日 20 日均成交量（成交量按"手"折算） ----------
function _btCapacity(trades, btBars, ticketWan){
  var t=Math.max(1, ticketWan||10)*10000;
  var ratios=[], advs=[], i, j, idx, v, sh, lots;
  trades.forEach(function(tr){
    var b=btBars[tr.code]; if(!b) return;
    idx=-1;
    for(i=b.length-1;i>=0;i--){ if(b[i].day<=tr.date){ idx=i; break; } }
    if(idx<20) return;
    v=0; for(j=idx-19;j<=idx;j++) v+=b[j].volume; v/=20;
    if(!(v>0)) return;
    sh = t/(tr.entry||1);              // 股数
    lots = sh/100;                     // 手数
    ratios.push(lots/v); advs.push(v);
  });
  if(!ratios.length) return null;
  var srt=ratios.slice().sort(function(a,b){ return a-b; });
  return {ticketWan:(t/10000), n:ratios.length,
          avg:ratios.reduce(function(a,b){return a+b;},0)/ratios.length,
          max:srt[srt.length-1], p90:srt[Math.floor(srt.length*0.9)]||srt[srt.length-1],
          avgAdvLots:advs.reduce(function(a,b){return a+b;},0)/advs.length};
}
function _btTurnover(trades, eq){
  if(!trades.length || !eq || !eq.days.length) return null;
  var yrs=eq.days.length/252;
  return {perYear:trades.length/yrs,
          avgHold:trades.reduce(function(a,t){ return a+(t.hold||0); },0)/trades.length,
          exposure:eq.posCnt.reduce(function(a,b){ return a+(b>0?1:0); },0)/eq.posCnt.length,
          yrs:yrs};
}

// ---------- 同时持仓重叠度：把"同涨同跌的一批信号"折算成有效样本 ----------
// 取「平均同时在场的标的数」。不做这一步会把相关样本当独立样本，p 值被严重低估。
function _btOverlap(tr, btBars, cfg){
  try{
    var e=buildEquity(tr, btBars, (cfg&&cfg.cost)||0);
    return (e && e.avgPos>1)? e.avgPos : 1;
  }catch(e2){ return 1; }
}

// ---------- 循环块 Bootstrap（Politis & Romano 1994）：把"运气"实际跑一遍 ----------
// 为什么用「块」而不是逐笔独立重抽：同一段时间里的多笔交易会同涨同跌，
// 逐笔独立重抽会**低估方差**、把置信区间做窄。块长取平均持有日数，
// 让重抽片段保留"一段时间内的相关结构"。伪随机用 mulberry32，固定种子可复现。
// scale = 1/K（K=平均同时持仓只数）：回撤必须按"每笔只占 1/K 仓"折算。
// 若按"每笔满仓"复利 481 笔，净值会虚涨到几百倍、回撤虚高到 70%+（理论极限≈1-e^(-σ²/2μ)≈100%），
// 那不是组合能实现的路径，只会吓人。折算后才与「四、回撤明细」的按日口径可比。
function _btBootstrap(rets, B, seed, blockLen, scale){
  var n=rets.length; if(n<20) return null;
  B = Math.max(200, Math.round(B||2000));
  var L = Math.max(1, Math.min(n, Math.round(blockLen||1)));
  var sc = (scale>0)? scale : 1;
  var st = (seed||20260914)>>>0;
  function rnd(){ st=(st+0x6D2B79F5)>>>0; var t=st; t=Math.imul(t^(t>>>15), t|1); t^=t+Math.imul(t^(t>>>7), t|61); return ((t^(t>>>14))>>>0)/4294967296; }
  var i,k,b,obs=0;
  for(i=0;i<n;i++) obs+=rets[i]; obs/=n;
  var means=[], mdds=[], negN=0;
  for(k=0;k<B;k++){
    var s=0, eq=1, peak=1, mdd=0, cnt=0;
    while(cnt<n){
      var start=Math.floor(rnd()*n);
      for(b=0;b<L && cnt<n;b++){
        var r=rets[(start+b)%n]; cnt++;
        s+=r; eq*=(1+r/100*sc);
        if(eq>peak) peak=eq;
        var dd=1-eq/peak; if(dd>mdd) mdd=dd;
      }
    }
    var mn=s/n; means.push(mn); mdds.push(mdd);
    if(mn<=0) negN++;
  }
  function asc(x,y){ return x-y; }
  means.sort(asc); mdds.sort(asc);
  function q(a,p){ return a[Math.min(a.length-1, Math.max(0, Math.round((a.length-1)*p)))]; }
  return {B:B, n:n, L:L, sc:sc, obs:obs,
          lo:q(means,0.025), p05:q(means,0.05), p25:q(means,0.25), med:q(means,0.5),
          p75:q(means,0.75), hi:q(means,0.975), pNeg:negN/B,
          ddMed:q(mdds,0.5), dd95:q(mdds,0.95), dd99:q(mdds,0.99), ddMax:mdds[mdds.length-1]};
}

// ---------- 成本敏感性：净收益 = 毛收益 − 成本，可精确推移（不必重跑回测） ----------
// 因为 t.ret 就是 t.retG − cfg.cost，所以"换一个成本档位"只是整体平移，无需重新模拟。
function _btCostSensitivity(trades, costs){
  var g=[], i;
  trades.forEach(function(t){ g.push(t.retG!=null? t.retG : t.ret); });
  if(g.length<20) return null;
  var mg=0; for(i=0;i<g.length;i++) mg+=g[i]; mg/=g.length;
  var rows=(costs||[0,0.10,0.20,0.30,0.50,0.80,1.00]).map(function(c){
    var w=0; for(i=0;i<g.length;i++) if(g[i]-c>0) w++;
    return {cost:c, mean:mg-c, win:w/g.length};
  });
  return {grossMean:mg, n:g.length, rows:rows, breakeven:mg, cur:BTCFG.cost};
}

// ---------- 持有期敏感性：换一个持有天数整段重跑，看优势是否只在某一点上成立 ----------
function _btHoldSensitivity(btBars, grid, cfg, nameOf){
  var codes=Object.keys(btBars||{}).filter(function(c){ return btBars[c] && btBars[c].length>=140; });
  if(codes.length<3) return null;
  var rows=[];
  grid.forEach(function(hd){
    var tr=[], sk=0, q2;
    codes.forEach(function(c){
      var r=btSimulate(c, (nameOf&&nameOf[c])||c, btBars[c], hd, cfg);
      sk+=r.skipped;
      for(q2=0;q2<r.trades.length;q2++) tr.push(r.trades[q2]);
    });
    if(tr.length<20){ rows.push({hd:hd, n:tr.length, mean:null, gross:null, win:null, t:null, skipped:sk}); return; }
    var i2, gm=0;
    for(i2=0;i2<tr.length;i2++) gm+=(tr[i2].retG!=null? tr[i2].retG : tr[i2].ret);
    gm/=tr.length;
    var st=_btStats(tr.map(function(t){ return t.ret; }), _btOverlap(tr, btBars, cfg));
    rows.push({hd:hd, n:tr.length, mean:(st?st.mean:null), gross:gm,
               win: tr.filter(function(t){ return t.ret>0; }).length/tr.length,
               t:(st?st.tEff:null), skipped:sk});
  });
  var best=null;
  rows.forEach(function(r){ if(r.mean!=null && (!best || r.mean>best.mean)) best=r; });
  return {rows:rows, best:best, codes:codes.length};
}

// ---------- 渲染：机构级区块（10 张卡） ----------
function _btInstHtml(eq, bench, trades){
  if(!trades || trades.length<40){
    return '<div style="margin-top:14px;font-size:12px;color:var(--text3);background:var(--panel,#fff);border:1px dashed var(--border);border-radius:12px;padding:12px 15px;">'
      + '机构级验证需要 ≥40 笔样本（当前 '+(trades?trades.length:0)+' 笔）。请点上方「全池批量回测」后回来看这一节。</div>';
  }
  var cfg=BTCFG, h='';
  function card(title, sub, body){
    return '<div style="margin-top:14px;background:var(--panel,#fff);border:1px solid var(--border);border-radius:12px;padding:13px 15px;">'
      + '<div style="font-size:12.5px;font-weight:800;color:var(--text);">'+title+'</div>'
      + (sub? ('<div style="font-size:11px;color:var(--text3);margin:4px 0 9px;line-height:1.7;">'+sub+'</div>') : '<div style="height:9px;"></div>')
      + body + '</div>';
  }
  function tbl(head, rows){
    var th='', tb='', j, r, c;
    for(j=0;j<head.length;j++) th += '<th style="text-align:left;color:var(--text3);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--border);white-space:nowrap;">'+head[j]+'</th>';
    for(r=0;r<rows.length;r++){
      tb += '<tr>';
      for(c=0;c<rows[r].length;c++) tb += '<td style="padding:4px 6px;border-bottom:1px solid var(--border);white-space:nowrap;">'+rows[r][c]+'</td>';
      tb += '</tr>';
    }
    return '<div style="overflow-x:auto;"><table style="width:100%;font-size:11.5px;border-collapse:collapse;"><thead><tr>'+th+'</tr></thead><tbody>'+tb+'</tbody></table></div>';
  }
  function chipM(label, val, color, sub){
    return '<div style="background:var(--card2,#f6f8fc);border:1px solid var(--border);border-radius:9px;padding:7px 9px;">'
      + '<div style="font-size:10px;color:var(--text3);">'+label+'</div>'
      + '<div style="font-size:15px;font-weight:800;color:'+(color||'var(--text)')+';margin-top:2px;">'+val+'</div>'
      + (sub?('<div style="font-size:9.5px;color:var(--text3);margin-top:1px;">'+sub+'</div>'):'')
      + '</div>';
  }
  function gridBox(items){ return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;">'+items.join('')+'</div>'; }
  function pp(x){ return (x>0?'+':'')+(x*100).toFixed(2)+'%'; }
  function n2(x){ return (+x).toFixed(2); }
  function sd2(d){ return d? String(d).slice(2) : '—'; }

  // ===== ① 样本外与稳健性 =====
  var segs=_btSegments(trades,4), half=_btHalfSplit(trades), wf=null;
  var body1='';
  if(segs){
    body1 += '<div style="font-size:11px;color:var(--text3);margin-bottom:5px;">A. 时间稳定性：按成交日把 '+trades.length+' 笔切成 4 段</div>';
    body1 += tbl(['段','区间','笔数','净期望/笔','胜率','t'], segs.map(function(s){
      return ['第'+s.idx+'段', sd2(s.from)+'→'+sd2(s.to), s.n, '<b style="color:'+_btColor(s.mean)+'">'+n2(s.mean)+'%</b>', (s.win*100).toFixed(0)+'%', n2(s.t)];
    }));
    body1 += '<div style="font-size:11px;color:var(--text3);margin-top:9px;line-height:1.75;">'
      + '这不是"样本外"（没有在任何一段上拟合参数），只检验<b>优势是否集中在某一段时间</b>。'
      + '若正期望只出现在其中一两次，说明这条优势多半来自那段行情，而不是稳定的规则。</div>';
  }
  if(half){
    var stable=(half.a.mean>0 && half.b.mean>0), deg=half.b.mean-half.a.mean;
    body1 += '<div style="font-size:11px;color:var(--text3);margin:11px 0 5px;">B. 前半段 vs 后半段（'+sd2(half.a.from)+'→'+sd2(half.a.to)+' ／ '+sd2(half.b.from)+'→'+sd2(half.b.to)+'）</div>';
    body1 += tbl(['区间','笔数','净期望/笔','胜率','t'], [
      ['前半段', half.a.n, '<b style="color:'+_btColor(half.a.mean)+'">'+n2(half.a.mean)+'%</b>', (half.a.win*100).toFixed(0)+'%', n2(half.a.t)],
      ['后半段', half.b.n, '<b style="color:'+_btColor(half.b.mean)+'">'+n2(half.b.mean)+'%</b>', (half.b.win*100).toFixed(0)+'%', n2(half.b.t)]
    ]);
    body1 += '<div style="font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.75;">'
      + (stable
          ? ('✅ 两段都是正期望、方向一致'+(deg<0? ('（后半段弱了 '+Math.abs(deg).toFixed(2)+'pp/笔，属正常衰减）') : '（后半段更强，留意是否尾部行情拉动）'))
          : '⚠️ 只有一段是正期望 → 优势高度依赖特定区间，不能当成可重复的能力。')
      + '</div>';
  }
  try{ wf=_btWalkForward(BT_STATE.btBars, [3,5,7,10,15], 4, cfg, null); }catch(e){ wf=null; }
  var body1c='';
  if(wf && wf.folds.length){
    body1c += '<div style="font-size:11px;color:var(--text3);margin:13px 0 5px;">C. <b>锚定式 Walk-forward（真·样本外）</b>：在 IS 段从持有期 {3,5,7,10,15} 里挑最优，再到<b>没参与选择的</b>下一段 OOS 上验证</div>';
    body1c += tbl(['轮次','IS 选中持有期','IS 笔数','IS 净期望/笔','OOS 笔数','OOS 净期望/笔','OOS t','OOS t_eff'], wf.folds.map(function(f){
      return ['第'+f.fold+'轮', f.hd+' 日', f.isN, n2(f.isMean)+'%', f.oosN,
              (f.oosMean==null? '—' : '<b style="color:'+_btColor(f.oosMean)+'">'+n2(f.oosMean)+'%</b>'),
              (f.oosTraw==null? '—' : n2(f.oosTraw)), (f.oosT==null? '—' : n2(f.oosT))];
    }));
    var pw=wf.pooled, fs=wf.fullBest;
    var pass = !!(pw && pw.mean>0 && pw.pEff<0.05 && pw.nEff>=30);
    body1c += '<div style="margin-top:9px;font-size:12px;line-height:1.85;color:var(--text2);">'
      + '<b>汇总（各轮 OOS 合并，共 '+wf.pooledN+' 笔）</b>：净期望 <b style="color:'+_btColor(pw.mean)+'">'+n2(pw.mean)+'%/笔</b>'
      + ' · 名义 t='+n2(pw.t)+' · p='+pw.p.toFixed(3)+'<br>'
      + '按<b>同时持仓重叠</b>折算（平均同时在场 '+n2(wf.pooledM)+' 只，ρ='+BTCFG.rho+'）：有效样本 n_eff≈<b>'+pw.nEff+'</b>'
      + ' → t_eff='+n2(pw.tEff)+' · <b>p_eff='+pw.pEff.toFixed(3)+'</b>（这一行才是"能不能算数"的口径）<br>'
      + '对照「全样本最优」：持有期 '+(fs?fs.hd:'—')+' 日 · 净期望 '+(fs? n2(fs.mean)+'%':'—')+'/笔'
      + ((fs&&pw)? (' —— 样本外比全样本最优<b>低 '+Math.abs(fs.mean-pw.mean).toFixed(2)+' 个百分点/笔</b>'
          + (fs.mean>0 && pw.mean/fs.mean<0.5 ? '（保留不足一半，说明大半是"挑"出来的）' : '（衰减有限，稳定性尚可）')) : '')
      + '<br><b style="color:'+(pass?'var(--up)':'var(--accent)')+';">判定：'
      + (pass
          ? '样本外仍是显著正期望 —— 这是在"参数完全没看过 OOS"的前提下取得的，可信度远高于全样本回测。'
          : (pw.mean<=0
              ? '样本外期望已转负 —— 全样本的好看数字不具备外推能力，不能据此下注。'
              : (pw.pEff>=0.05 && pw.p<0.05
                  ? '名义上样本外为正，但按"同时持仓同涨同跌"折算有效样本后就站不住了 —— 目前还说不上有优势。'
                  : '样本外在统计上无法与"零优势"区分 —— 不能据此下注。')))
      + '</b></div>';
  } else {
    body1c += '<div style="font-size:11.5px;color:var(--text3);margin-top:11px;">C. Walk-forward 需要 ≥260 个交易日日历且 ≥8 只有效标的，当前数据不足，已跳过。</div>';
  }
  h += card('🧪 一、样本外与稳健性检验', '全样本回测好看只是入场券，样本外站得住才是本事。这一节是整份报告里最该看的部分。', body1+body1c);

  // ===== ② Alpha / Beta =====
  var bd = eq? _btBenchDaily(eq.days) : null;
  var ab = (eq && bd)? _btAlphaBeta(eq.daily, bd) : null;
  var body2='';
  if(ab){
    var alphaOk = (ab.alphaAnn>0 && ab.pAlpha<0.05);
    body2 = gridBox([
      chipM('年化 Alpha', (ab.alphaAnn>0?'+':'')+(ab.alphaAnn*100).toFixed(2)+'%', _btColor(ab.alphaAnn), 't='+n2(ab.tAlpha)+' · p='+ab.pAlpha.toFixed(3)),
      chipM('Beta', n2(ab.beta), ab.beta>1.2?'var(--accent)':'var(--text2)', '对'+(bench?bench.name:'基准')+'的暴露'),
      chipM('R²', (ab.r2*100).toFixed(0)+'%', 'var(--text2)', '收益被基准解释的比例'),
      chipM('信息比率 IR', n2(ab.ir), ab.ir>0.5?'var(--up)':'var(--text2)', '年化超额 ÷ 跟踪误差'),
      chipM('年化跟踪误差', (ab.te*100).toFixed(1)+'%', 'var(--text2)', '相对基准的偏离'),
      chipM('上行捕获', (ab.upCap*100).toFixed(0)+'%', ab.upCap>=1?'var(--up)':'var(--accent)', '基准涨时跟多少'),
      chipM('下行捕获', (ab.dnCap*100).toFixed(0)+'%', ab.dnCap<=1?'var(--up)':'var(--accent)', '基准跌时跌多少'),
      chipM('年化超额', (ab.excessAnn>0?'+':'')+(ab.excessAnn*100).toFixed(2)+'%', _btColor(ab.excessAnn), '相对基准均值差')
    ])
    + '<div style="font-size:12px;line-height:1.85;color:var(--text2);margin-top:10px;">'
    + '<b>怎么读：</b>Alpha 是"与大盘涨跌无关的那部分收益"，Beta 是"随大盘涨跌的那部分"。'
    + (alphaOk
        ? ('当前 <b style="color:var(--up)">Alpha 显著为正（p='+ab.pAlpha.toFixed(3)+'）</b>，即剔除大盘影响后仍有超额 —— 这是"本事"。')
        : ('当前 <b style="color:var(--accent)">Alpha 不显著（p='+ab.pAlpha.toFixed(3)+'）</b>，意味着收益主要靠 Beta（仓位/大盘）取得，难言"本事"。'))
    + '<br>理想形态是 <b>上行捕获 &gt; 100% 且下行捕获 &lt; 100%</b>（涨得多、跌得少）；'
    + '若两者都接近 Beta×100%，说明只是"跟着指数走"，不如直接买指数基金。'
    + '<br><span style="color:var(--text3);font-size:11px;">口径：无风险利率取 0（未接入国债收益率）→ Alpha 略偏乐观；回归样本 '+ab.n+' 个交易日。</span>'
    + '</div>';
  } else if(eq){
    body2 = '<div style="font-size:11.5px;color:var(--text3);">基准日线未取到（或重叠交易日不足 40 天），无法做 Alpha/Beta 回归。请确认「沪深300」基准已成功加载。</div>';
  }
  h += card('⚖️ 二、收益拆解：Alpha 还是 Beta？', '净值跑赢指数 ≠ 有本事。这一节把收益拆开看。', body2);

  // ===== ③ 风险与尾部 =====
  var rrk = eq? _btRiskRatios(eq.daily) : null;
  var body3;
  if(rrk){
    body3 = gridBox([
      chipM('Sortino', n2(rrk.sortino), rrk.sortino>1?'var(--up)':'var(--text2)', '只惩罚下行波动'),
      chipM('Omega', n2(rrk.omega), rrk.omega>1.2?'var(--up)':'var(--text2)', '总盈利 ÷ 总亏损'),
      chipM('Ulcer 指数', (rrk.ulcer*100).toFixed(1)+'%', rrk.ulcer<0.05?'var(--up)':'var(--accent)', '回撤深度×持续期'),
      chipM('日 VaR 95%', (Math.abs(rrk.var95)*100).toFixed(2)+'%', 'var(--accent)', '最差 5% 日的门槛'),
      chipM('日 CVaR 95%', (Math.abs(rrk.cvar95)*100).toFixed(2)+'%', 'var(--down)', '最差 5% 日的均值'),
      chipM('日 VaR 99%', (Math.abs(rrk.var99)*100).toFixed(2)+'%', 'var(--down)', '尾部极端门槛'),
      chipM('尾部比', n2(rrk.tailRatio), rrk.tailRatio>1?'var(--up)':'var(--accent)', '右尾 ÷ 左尾'),
      chipM('偏度', n2(rrk.skew), rrk.skew>0?'var(--up)':'var(--accent)', '负值=左尾更厚'),
      chipM('超额峰度', n2(rrk.kurt), rrk.kurt>3?'var(--accent)':'var(--text2)', '尖峰厚尾程度'),
      chipM('最差单日', (rrk.worst*100).toFixed(2)+'%', 'var(--down)', '样本内极值'),
      chipM('最好单日', (rrk.best*100).toFixed(2)+'%', 'var(--up)', '样本内极值')
    ]) + '<div style="font-size:11.5px;color:var(--text3);margin-top:9px;line-height:1.75;">'
      + 'VaR/CVaR 用<b>历史分位法</b>（不假设正态分布）。注意：样本内极值只代表"已经发生过的"，不等于"最多能跌多少"；'
      + '偏度为负、峰度偏高说明左尾更厚，<b>实盘单日大亏的概率高于正态假设</b>。</div>';
  } else {
    body3 = '<div style="font-size:11.5px;color:var(--text3);">需要净值序列（请跑全池批量回测）。</div>';
  }
  h += card('🌊 三、风险与尾部', '波动率回答"平均有多抖"，尾部回答"最坏能多坏" —— 后者才决定你会不会被打爆。', body3);

  // ===== ④ 回撤明细 =====
  var dds = eq? _btDrawdowns(eq.days, eq.eq, 5) : [];
  var body4 = dds.length? (tbl(['名次','回撤深度','峰日','谷底','修复日','到谷(交易日)','修复(交易日)'], dds.map(function(d,k){
      return ['#'+(k+1), '<b style="color:var(--down)">'+(d.depth*100).toFixed(2)+'%</b>', d.peakDay, d.troughDay,
              (d.recoverDay||'<span style="color:var(--accent)">未修复</span>'), d.toTrough, (d.fromTrough==null?'—':d.fromTrough)];
    })) + '<div style="font-size:11.5px;color:var(--text3);margin-top:9px;line-height:1.75;">'
      + '机构看回撤只问三件事：<b>多深</b>（是否超出你的承受区间）、<b>多久</b>（长期不修复会击穿执行纪律）、'
      + '<b>是否仍在修复中</b>（"未修复"的坑才是真正的心理考验）。</div>')
    : '<div style="font-size:11.5px;color:var(--text3);">需要净值序列。</div>';
  h += card('📉 四、回撤明细（前 5 深）', '', body4);

  // ===== ⑤ 波动率目标化 =====
  var base=null, vts=null, avgScale=1;
  if(eq && eq.daily && eq.daily.length>60){
    var tv=_btVolTarget(eq.daily, 0.15, 20, 2);
    base=_btSeriesStats(eq.daily); vts=_btSeriesStats(tv.rets); avgScale=tv.avgScale;
  }
  var body5;
  if(base && vts){
    body5 = tbl(['口径','累计收益','年化','年化波动','Sharpe','最大回撤'], [
      ['原始（等权）', pp(base.cum), pp(base.ann), (base.vol*100).toFixed(1)+'%', n2(base.sharpe), (base.mdd*100).toFixed(1)+'%'],
      ['波动率目标化 15%', pp(vts.cum), pp(vts.ann), (vts.vol*100).toFixed(1)+'%', n2(vts.sharpe), (vts.mdd*100).toFixed(1)+'%']
    ]) + '<div style="font-size:11.5px;color:var(--text3);margin-top:9px;line-height:1.75;">'
      + '做法：用<b>截至前一日</b>的 20 日已实现波动算缩放系数（目标年化 15%，系数夹在 0.2~2 倍之间），再乘当日组合收益 —— 不含未来信息。'
      + '平均仓位系数 <b>'+n2(avgScale)+'×</b>。这是机构标配动作：<b>让波动率稳定，而不是让仓位稳定</b>；'
      + '通常能压低回撤、抬升 Sharpe，代价是牛市里少赚。<br>'
      + '注：此处只缩放收益，未计调仓产生的额外交易成本（真实结果会略差）。</div>';
  } else {
    body5 = '<div style="font-size:11.5px;color:var(--text3);">需要 ≥60 个交易日的净值序列。</div>';
  }
  h += card('🎚️ 五、仓位管理：波动率目标化', '散户按"感觉"给仓位，机构按"风险"给仓位。', body5);

  // ===== ⑥ Deflated Sharpe =====
  var trials=[], dsr=null;
  if(eq && eq.daily && BT_STATE.btBars){
    try{
      BT_SIGNALS.forEach(function(s){
        var e=buildEquity(trades.filter(function(t){ return t.sig===s.id; }), BT_STATE.btBars, cfg.cost);
        if(e && e.daily && e.daily.length>30){ var mo=_btMoments(e.daily); if(mo && mo.sd>0) trials.push(mo.mean/mo.sd); }
      });
    }catch(e){}
    dsr=_btDeflatedSharpe(eq.daily, trials, Math.max(2, trials.length)*5);
  }
  var body6;
  if(dsr){
    var dsrOk=(dsr.dsr>0.95);
    body6 = gridBox([
      chipM('观测 Sharpe(年化)', n2(dsr.srAnn), 'var(--text2)', '非年化 SR='+n2(dsr.srDaily)),
      chipM('运气能到 SR₀', n2(dsr.sr0), 'var(--accent)', '年化≈'+n2(dsr.sr0*Math.sqrt(252))),
      chipM('试验次数 N', dsr.N, 'var(--text2)', '你一共挑了多少变体'),
      chipM('Deflated Sharpe', dsr.dsr.toFixed(3), dsr.dsr>0.95?'var(--up)':(dsr.dsr>0.9?'var(--accent)':'var(--down)'), '>0.95 才算过关')
    ]) + '<div style="font-size:12px;line-height:1.85;color:var(--text2);margin-top:10px;">'
      + (dsrOk
          ? '<b style="color:var(--up)">通过。</b>在"试过约 N='+dsr.N+' 个变体"的前提下，观测 Sharpe 高于"纯运气能挑到的最高 Sharpe"，说明优势不只是筛选噪音。'
          : '<b style="color:var(--down)">未通过。</b>考虑到你共试了约 N='+dsr.N+' 个变体，观测 Sharpe 并未显著高于"纯运气能挑到的最高 Sharpe"（SR₀='+n2(dsr.sr0)+'，年化≈'+n2(dsr.sr0*Math.sqrt(252))+'）。<b>"从一堆里挑出最好看的那条"本身就是过拟合</b>，该结果不能外推。')
      + '<br><span style="color:var(--text3);font-size:11px;">口径：Bailey &amp; López de Prado (2014)。SR₀ 由试验间 Sharpe 的横截面散度与 N 推得；'
      + '本页散度用 '+dsr.trialsN+' 条实测序列估计（5 个信号各自 + 组合），N 再乘 5 个持有期网格，属保守估计。'
      + '偏度 '+n2(dsr.skew)+' · 超额峰度 '+n2(dsr.kurt)+' · 样本 '+dsr.T+' 日。</span></div>';
  } else {
    body6 = '<div style="font-size:11.5px;color:var(--text3);">需要净值序列。</div>';
  }
  h += card('🎲 六、Deflated Sharpe：给"试了很多次"打折', '"试 30 次挑最好的"与"只试 1 次就成了"，完全不是一回事。这是机构对付它的标准做法。', body6);

  // ===== ⑦ 容量与换手 =====
  var cap=_btCapacity(trades, BT_STATE.btBars, 10), to=_btTurnover(trades, eq);
  var body7;
  if(cap || to){
    var bits=[];
    if(to) bits.push('年化换手 <b>'+to.perYear.toFixed(0)+' 笔/年</b>（样本跨度 '+to.yrs.toFixed(1)+' 年）· 平均持有 <b>'+n2(to.avgHold)+' 个交易日</b> · 有仓位交易日占比 <b>'+(to.exposure*100).toFixed(0)+'%</b>');
    if(cap) bits.push('按<b>单笔票面 '+cap.ticketWan+' 万元</b>估算：平均占当日 20 日均成交量的 <b>'+(cap.avg*100).toFixed(3)+'%</b>，90 分位 '+(cap.p90*100).toFixed(3)+'%，最大 '+(cap.max*100).toFixed(3)+'%');
    body7 = '<div style="font-size:12px;line-height:1.9;color:var(--text2);">· '+bits.join('<br>· ')+'</div>'
      + '<div style="font-size:11.5px;color:var(--text3);margin-top:9px;line-height:1.75;">'
      + '为什么关心：一个策略在 10 万本金上有效，不代表在 1000 万上还有效 —— <b>成交量会限制你的规模</b>，买进去本身就会推高价格。'

    ]) + '<div style="font-size:12px;line-height:1.85;color:var(--text2);margin-top:10px;">'

      + (ciOk

          : (bs.obs>0

      + '<br><b>注意：这一节只回答"样本内是不是靠运气"</b>，解决不了"参数是不是我挑出来的" —— 后者要看第一节 C（Walk-forward）与第六节（Deflated Sharpe）。'
      + '三节一起过，才谈得上有优势。'
      + '<br><span style="color:var(--text3);font-size:11px;">口径：循环块 Bootstrap（Politis &amp; Romano 1994），块长取平均持有 '+bs.L+' 个交易日，'
      + '用以保留"同期持仓同涨同跌"的相关结构（逐笔独立重抽会把区间做得过窄）；伪随机固定种子，结果可复现。'
      + '回撤按<b>等权 1/K 折算</b>（K='+n2(1/bs.sc)+' 只平均同时在场，即每笔只占 1/K 仓），与「四、回撤明细」的按日口径可比；'

      var isCur = Math.abs(r.cost-cs.cur)<1e-6;
      return [ (isCur? '<b>'+r.cost.toFixed(2)+'% ←当前</b>' : r.cost.toFixed(2)+'%'),
               '<b style="color:'+_btColor(r.mean)+'">'+n2(r.mean)+'%</b>', (r.win*100).toFixed(0)+'%' ];
    }));
    body10 += '<div style="font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.75;">'

              : ' 毛期望很薄，<b>成本几乎吃掉全部优势</b>，实盘大概率更差。'))
      + '</div>';
  }
  if(hs && hs.rows.length){
    body10 += '<div style="font-size:11px;color:var(--text3);margin:13px 0 5px;">B. 持有期敏感性（换持有天数整段重跑，'+hs.codes+' 只有效标的）</div>';
    body10 += tbl(['持有期','笔数','毛期望/笔','净期望/笔','胜率','t_eff'], hs.rows.map(function(r){
      var isBest = (hs.best && r.hd===hs.best.hd);
      return [ (isBest? '<b>'+r.hd+' 日 ★</b>' : r.hd+' 日'), r.n,
               (r.gross==null? '—' : n2(r.gross)+'%'),
               (r.mean==null? '—' : '<b style="color:'+_btColor(r.mean)+'">'+n2(r.mean)+'%</b>'),
               (r.win==null? '—' : (r.win*100).toFixed(0)+'%'),
               (r.t==null? '—' : n2(r.t)) ];
    }));
    var vd=0, tot=0;
    hs.rows.forEach(function(r){ if(r.mean!=null){ tot++; if(r.mean>0) vd++; } });
    body10 += '<div style="font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.75;">'
      + (tot? ('在 '+tot+' 个可算的持有期里，<b>'+vd+' 个净期望为正</b>。') : '')
      + (tot && vd===tot
          ? ' <b style="color:var(--up)">整条曲线同号</b> → 优势不是靠"正好挑中某个持有天数"，稳健性加分。'
          : (tot && vd/tot>=0.5
              ? ' <b style="color:var(--accent)">只有部分持有期为正</b> → 对参数有一定依赖，别把最优那一格当成"最优参数"来相信。'

      + '<br>★ 标记的是本轮网格里净期望最高的那一格。机构看这张表的重点是<b>曲线形状</b>：'
      + '平坦（相邻格数字接近）说明不敏感、可信度高；尖峰（只有一格好看）通常就是过拟合。'
      + '<br>另外留意 <b>t_eff</b> 列 —— 它是按"同时持仓重叠"折算后的有效 t。'
      + '若每一格都为正、但 t_eff 全都没到 2，那是"方向一致但强度不够"：可作参考，不足以当结论。'
      + '</div>';
  }
  h += card('🧭 十、敏感性与脆弱点：成本 × 持有期', '一个策略只在某个精确参数点上成立，等于不成立。这一节专门找它最脆的地方。', body10);

  return h;
}

function renderBtResults(){
  var trades = BT_STATE.trades;
  var stats = aggregateTrades(trades);
  var n = trades.length, wins = trades.filter(function(t){return t.ret>0;}).length;
  var sum = trades.reduce(function(a,t){return a+t.ret;},0);
  var sumG = trades.reduce(function(a,t){return a+(t.retG!=null?t.retG:t.ret);},0);
  var winSum = trades.filter(function(t){return t.ret>0;}).reduce(function(a,t){return a+t.ret;},0);
  var lossSum = trades.filter(function(t){return t.ret<=0;}).reduce(function(a,t){return a+Math.abs(t.ret);},0);
  var avg = n? sum/n : 0, avgG = n? sumG/n : 0, avgW = wins? winSum/wins : 0, avgL = (n-wins)? lossSum/(n-wins) : 0;
  var pl = avgL? avgW/avgL : (wins?99:0);
  var wr = n? wins/n : 0;
  var avgHold = n? trades.reduce(function(a,t){return a+(t.hold||0);},0)/n : 0;
  var hitStop = trades.filter(function(t){ return t.reason && t.reason.indexOf('止损')>=0; }).length;

  function setTxt(id, v){ var el=document.getElementById(id); if(el) el.textContent = v; }
  function setColor(id, v){ var el=document.getElementById(id); if(el) el.style.color = _btColor(v); }
  setTxt('btKStocks', BT_STATE.stocks);
  setTxt('btKTrades', n);
  setTxt('btKWin', n? (wr*100).toFixed(1)+'%' : '—');
  setTxt('btKAvg', n? _btPct(avg) : '—');
  setTxt('btKAvgG', n? _btPct(avgG) : '—');
  setTxt('btKPL', n? pl.toFixed(2) : '—');
  setTxt('btKSkip', BT_STATE.skipped? BT_STATE.skipped : (n? 0 : '—'));
  setColor('btKWin', (wr-0.5)*100);
  setColor('btKAvg', avg);
  setColor('btKAvgG', avgG);
  setColor('btKSkip', -1);
  var subEl = document.getElementById('btAvgSub');
  if(subEl) subEl.textContent = n? ('毛 '+_btPct(avgG)+' − 成本 '+BTCFG.cost+'%') : '已扣交易成本';

  // 净值曲线（重算）
  BT_STATE.equity = buildEquity(trades, BT_STATE.btBars, BTCFG.cost);
  renderBtReport(BT_STATE.equity, BT_STATE.bench, stats, trades);

  // K线源提示：用不复权数据回测会失真，必须显式告警
  var srcNote = document.getElementById('btSrcNote');
  if(srcNote){
    var srctxt = BT_SRC.last || '';
    if(srctxt.indexOf('不复权') >= 0){
      srcNote.innerHTML = '<div style="background:linear-gradient(120deg,rgba(224,138,30,.14),rgba(224,138,30,.06));box-shadow:inset 0 0 0 1px rgba(224,138,30,.35);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--accent);line-height:1.7;">'
        + '⚠️ <b>本次用的是「腾讯不复权」兜底数据</b>（' + srctxt + '）：前复权源被网络拦下了。不复权价未还原除权除息，长周期回测的收益与最大亏损会失真，'
        + '建议换网络（如手机热点）后重跑，或把持有窗口缩短到 5 日降低影响。</div>';
    } else if(srctxt){
      srcNote.innerHTML = '<div style="font-size:11.5px;color:var(--text3);">K线源：<b style="color:var(--text2);">' + srctxt + '</b>（前复权，含除权除息还原）</div>';
    } else {
      srcNote.innerHTML = '';
    }
  }

  var rows = BT_SIGNALS.map(function(s){
    var st = stats[s.id];
    var w = st.n? st.wins/st.n : 0;
    var ev = st.n? st.sum/st.n : 0;
    var evG = st.n? st.sumG/st.n : 0;
    var aw = st.wins? st.winSum/st.wins : 0;
    var al = (st.n-st.wins)? st.lossSum/(st.n-st.wins) : 0;
    var plv = al? aw/al : (st.wins?99:0);
    var ss = _btStats(st.rets, Math.max(1, Math.round(st.n? st.holdSum/st.n : 1)));
    var quality;
    if(st.n===0) quality = '<span class="badge b-tag" style="opacity:.65;">样本不足</span>';
    else if(st.n<30) quality = '<span class="badge b-tag" style="opacity:.85;">样本偏少</span>';
    else if(ss && ss.p < 0.05/BT_SIGNALS.length && ev>0) quality = '<span class="badge b-buy">统计显著</span>';
    else if(ss && ss.p < 0.05 && ev>0) quality = '<span class="badge b-wait">名义显著</span>';
    else if(ev>0) quality = '<span class="badge b-tag">不显著</span>';
    else quality = '<span class="badge b-sell">负期望</span>';
    return '<tr><td><b>'+s.id+'</b> '+s.name+'<br><span style="color:var(--text3);font-size:11px;white-space:normal;">'+s.desc+'</span></td>'
      + '<td>'+st.n+'</td>'
      + '<td style="color:'+_btColor(w-0.5)+';font-weight:700;">'+(st.n?(w*100).toFixed(1)+'%':'—')+'</td>'
      + '<td style="color:'+_btColor(evG)+';">'+(st.n?_btPct(evG):'—')+'</td>'
      + '<td style="color:'+_btColor(ev)+';font-weight:700;">'+(st.n?_btPct(ev):'—')+'</td>'
      + '<td>'+(st.n?plv.toFixed(2):'—')+'</td>'
      + '<td>'+(st.n?(st.holdSum/st.n).toFixed(1)+' 日':'—')+'</td>'
      + '<td style="color:var(--down);">'+(st.n?_btPct(st.worst):'—')+'</td>'
      + '<td>'+(ss? ss.t.toFixed(2) : '—')+'</td>'
      + '<td style="color:'+(ss && ss.p<0.05 ? 'var(--up)' : 'var(--text3)')+';font-weight:700;">'+(ss? ss.p.toFixed(3) : '—')+'</td>'
      + '<td>'+quality+'</td></tr>';
  }).join('');
  var stEl = document.getElementById('btSignalTable');
  if(stEl) stEl.innerHTML =
    '<table><thead><tr><th>信号</th><th>次数</th><th>胜率</th><th>毛期望/笔</th><th>净期望/笔</th><th>盈亏比</th><th>平均持有</th><th>最差单笔</th><th>t 值</th><th>p 值</th><th>评级</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + '<div style="font-size:11px;color:var(--text3);padding-top:9px;line-height:1.7;">'
    + '口径说明：<b>毛期望</b>=未扣成本；<b>净期望</b>=毛期望 − '+BTCFG.cost+'% 往返成本（<b>这才是你实际能拿到的</b>）；'
    + '<b>p 值</b>为双侧正态近似，p&lt;'+(0.05/BT_SIGNALS.length).toFixed(3)+' 才算通过 5 信号的多重检验校正；'
    + '<b>最差单笔</b>用于衡量止损位是否真的保护了你。次数 &lt; 30 的信号不要单独下注 —— 那不是规律，是样本噪声。</div>';

  var recent = trades.slice(-50).reverse();
  var trows = recent.map(function(t){
    return '<tr><td>'+t.date+'</td><td><b>'+t.name+'</b><br><span style="color:var(--text3);font-size:11px;">'+t.code+'</span></td>'
      + '<td>'+t.sig+' '+t.sigName+'</td><td>'+t.entry.toFixed(2)+'</td><td>'+t.exit.toFixed(2)+'</td>'
      + '<td style="color:'+_btColor(t.retG!=null?t.retG:t.ret)+';opacity:.7;">'+_btPct(t.retG!=null?t.retG:t.ret)+'</td>'
      + '<td style="color:'+_btColor(t.ret)+';font-weight:700;">'+_btPct(t.ret)+'</td>'
      + '<td>'+t.hold+'日</td><td>'+t.reason+'</td><td>'+t.exitDate+'</td></tr>';
  }).join('');
  var ttEl = document.getElementById('btTradeTable');
  if(ttEl) ttEl.innerHTML = trows
    ? '<table><thead><tr><th>信号日</th><th>标的</th><th>信号</th><th>入场价</th><th>出场价</th><th>毛收益</th><th>净收益</th><th>持有</th><th>出场</th><th>出场日</th></tr></thead><tbody>'+trows+'</tbody></table>'
    : '<div style="color:var(--text3);font-size:13px;padding:8px 0;">暂无交易样本（请先运行回测）</div>';
}

// 回测标的池：三重仓三层 + 扫描池/远东池，按代码去重
function btUniverse(){
  var seen={}, out=[];
  function push(arr, tier){
    (arr||[]).forEach(function(o){
      if(!o || !o.code) return;
      if(seen[o.code]) return;
      seen[o.code]=1; out.push({code:o.code, name:o.name || o.code, tier:tier});
    });
  }
  push(TIERS && TIERS.mid, '中长线埋伏池');
  push(TIERS && TIERS.swing, '波段池');
  push(TIERS && TIERS.short, '短线池');
  if(typeof SWING_POOL!=='undefined') push(SWING_POOL, '扫描入池');
  if(typeof FAREAST_POOL!=='undefined') push(FAREAST_POOL, '远东风控池');
  return out;
}

// 取同期基准（默认沪深300）。注意：fetchBTKline 会改写 BT_SRC.last，这里做保存/还原，
// 否则"K线源"提示会被基准的源覆盖，导致前复权/不复权的告警判断出错。
async function fetchBench(){
  var savedSrc = BT_SRC.last, savedErrs = BT_SRC.errs;
  try{
    var b = await fetchBTKline(BTCFG.bench, 400);
    BT_STATE.benchBars = b;
    var allDays = [];
    Object.keys(BT_STATE.btBars).forEach(function(c){ (BT_STATE.btBars[c]||[]).forEach(function(k){ allDays.push(k.day); }); });
    if(!allDays.length) allDays = b.map(function(k){ return k.day; });
    allDays.sort();
    BT_STATE.bench = buildBench(b, allDays[0], allDays[allDays.length-1]);
  }catch(e){
    BT_STATE.bench = null; BT_STATE.benchBars = null;
  }
  BT_SRC.last = savedSrc; BT_SRC.errs = savedErrs;
}

function fillBacktest(){
  var sel = document.getElementById('btStockSel');
  if(!sel) return;
  var uni = btUniverse();
  var groups = {};
  uni.forEach(function(s){ (groups[s.tier] = groups[s.tier] || []).push(s); });
  Object.keys(groups).forEach(function(tier){
    var og = document.createElement('optgroup'); og.label = tier;
    groups[tier].forEach(function(s){
      var o = document.createElement('option');
      o.value = s.code; o.dataset.name = s.name;
      o.textContent = s.name + ' ' + s.code;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  var scopeMeta = document.getElementById('btScopeMeta');
  if(scopeMeta && !BT_STATE.trades.length) scopeMeta.textContent = '待运行 · 可回测池共 ' + uni.length + ' 只';

  function resolveCode(){
    var customEl = document.getElementById('btCustomCode');
    var custom = customEl ? customEl.value.trim() : '';
    if(/^\d{6}$/.test(custom)){
      var pre = custom.charAt(0)==='6' ? 'sh' : 'sz';
      return {code: pre+custom, name: '自选 ' + custom};
    }
    var opt = sel.options[sel.selectedIndex];
    if(!opt) return null;
    return {code: sel.value, name: opt.dataset.name || opt.textContent};
  }

  var runBtn = document.getElementById('btRunBtn');
  if(runBtn) runBtn.onclick = async function(){
    var t = resolveCode(); if(!t) return;
    _btReadCfg();
    var hold = +document.getElementById('btHoldDays').value;
    var prog = document.getElementById('btProgress');
    prog.textContent = '⏳ 正在回测 ' + t.name + '（拉取近 400 日 K 线 · 自动多源容灾：腾讯前复权CDN → 腾讯前复权 → 东财前复权 → 腾讯不复权）…';
    runBtn.disabled = true;
    try{
      var res = await backtestStock(t.code, t.name, hold, BTCFG);
      BT_STATE.trades = res.trades; BT_STATE.stocks = 1; BT_STATE.skipped = res.skipped;
      BT_STATE.btBars = {}; BT_STATE.btBars[t.code] = res.bars;
      var sm = document.getElementById('btScopeMeta');
      if(sm) sm.textContent = t.name + ' · 持有≤' + hold + '日 · ' + res.trades.length + ' 笔信号';
      prog.innerHTML = '⏳ 正在取 ' + BTCFG.benchName + ' 做基准对比…';
      await fetchBench();
      renderBtResults();
      prog.innerHTML = '✅ 完成：<b style="color:var(--up);">' + t.name + '</b> 共触发 ' + res.trades.length + ' 个信号'
        + (res.skipped? ('，涨停跳过 ' + res.skipped + ' 个') : '')
        + '（K线源：' + BT_SRC.last + '）';
    }catch(e){ prog.innerHTML = '❌ 回测失败：' + (e && e.message ? e.message : e); }
    runBtn.disabled = false;
  };

  var batchBtn = document.getElementById('btBatchBtn');
  if(batchBtn) batchBtn.onclick = async function(){
    if(BT_STATE.running) return;
    _btReadCfg();
    BT_STATE.running = true; BT_STATE.trades = []; BT_STATE.stocks = 0;
    BT_STATE.btBars = {}; BT_STATE.skipped = 0; BT_STATE.bench = null; BT_STATE.benchBars = null;
    var hold = +document.getElementById('btHoldDays').value;
    var all = uni;
    var prog = document.getElementById('btProgress');
    var sm = document.getElementById('btScopeMeta');
    if(sm) sm.textContent = '全池 ' + all.length + ' 只 · 持有≤' + hold + '日 · 成本 ' + BTCFG.cost + '%';
    batchBtn.disabled = true;
    var failed = [];
    var srcCount = {};
    for(var k=0;k<all.length;k++){
      var s = all[k];
      prog.innerHTML = '⏳ 批量回测中 <b>' + s.name + '</b>（' + (k+1) + '/' + all.length + '）· 已累计 ' + BT_STATE.trades.length + ' 笔';
      try{
        var res = await backtestStock(s.code, s.name, hold, BTCFG);
        BT_STATE.trades = BT_STATE.trades.concat(res.trades);
        BT_STATE.btBars[s.code] = res.bars;
        BT_STATE.skipped += res.skipped;
        BT_STATE.stocks++;
        if(BT_SRC.last) srcCount[BT_SRC.last] = (srcCount[BT_SRC.last]||0) + 1;
        renderBtResults();
      }catch(e){ failed.push(s.name); }
      await new Promise(function(r){ setTimeout(r, 200); });
    }
    prog.innerHTML = '⏳ 正在取 ' + BTCFG.benchName + ' 做基准对比…';
    await fetchBench();
    var srcDesc = Object.keys(srcCount).map(function(k2){ return k2+'×'+srcCount[k2]; }).join('、');
    if(BT_SRC.last) BT_SRC.last = srcDesc;   // 供 btSrcNote 汇总展示；含"不复权"时仍触发告警
    renderBtResults();
    prog.innerHTML = '✅ 批量完成：' + BT_STATE.stocks + ' 只股票，共 ' + BT_STATE.trades.length + ' 个信号'
      + (BT_STATE.skipped ? ('，涨停跳过 ' + BT_STATE.skipped + ' 个') : '')
      + (srcDesc ? (' · K线源：' + srcDesc) : '')
      + (failed.length ? (' · 跳过 ' + failed.length + ' 只（数据源不可用）：' + failed.slice(0,6).join('、') + (failed.length>6?'…':'')) : '');
    batchBtn.disabled = false;
    BT_STATE.running = false;
  };

  restoreBtResults();
}

function viewDaily(){
  // 综合所有池，按「打分+PA健康度+共振池数」加权，取综合推荐Top5
  const poolMap = poolDupMap();
  const merged = {};
  const TIER_PRIO = {'中长线':6,'红利低波':5,'波段':4,'短线':3,'小市值':2,'N字':3,'CCI':3,'ADX':3,'假阴':3,'一阳':3};
  const add = (arr, tier)=>{ (arr||[]).forEach(o=>{
    if(!o||!o.code) return;
    const code = o.code;
    if(!merged[code]){
      merged[code] = {code, name:o.name, now:o.now, chg:o.chg, buy:o.buy, target:o.target, stop:o.stop, note:o.note, tier, score:0, src:[], _prio:(TIER_PRIO[tier]||3)};
    }
    const curPrio = TIER_PRIO[tier]||3;
    if(curPrio>merged[code]._prio){ merged[code]._prio=curPrio; merged[code].tier=tier; }
    const base = num(o.score)!=null?o.score:60;
    if(base>merged[code].score) merged[code].score = base;
    if(!o.buy && merged[code].buy) {} 
    if(o.buy && !merged[code].buy) merged[code].buy = o.buy;
    if(o.target && !merged[code].target) merged[code].target = o.target;
    if(o.stop && !merged[code].stop) merged[code].stop = o.stop;
    if(o.note) merged[code].note = o.note;
    merged[code].src.push(tier);
  }); };
  add(DIVIDEND_POOL,'红利低波'); add(SMALLCAP_POOL,'小市值'); add(SWING_POOL,'波段');
  add(NZI_POOL,'N字'); add(CCI_POOL,'CCI'); add(ADX_POOL,'ADX');
  add(FAKEYIN_POOL,'假阴'); add(ONELINE_POOL,'一阳');
  add(TIERS.mid,'中长线'); add(TIERS.short,'短线');
  // 计算综合分：打分 + PA健康度(0-40) + 共振加成(每池+5，上限15)
  const rows = Object.values(merged).map(c=>{
    const pa = paScoreAny(c);
    const dupN = (poolMap[c.code]||[]).length;
    const paBonus = pa>=75?30 : pa>=60?22 : pa>=50?14 : 4;
    const dupBonus = Math.min(dupN,4)*5;
    const tierPrio = c.tier==='中长线'?6 : c.tier==='波段'?4 : c.tier==='红利低波'?5 : c.tier==='小市值'?3 : 2;
    c.pa = pa; c.dupN = dupN;
    c.total = c.score + paBonus + dupBonus + tierPrio;
    return c;
  }).sort((a,b)=>b.total-a.total).slice(0,5);

  const cards = rows.map((c,i)=>{
    const upPct = num(c.target)!=null && num(c.now) ? Math.round((c.target/c.now-1)*100) : null;
    const rr = num(c.target)!=null && num(c.now)!=null && num(c.stop) ? ((c.target-c.now)/(c.now-c.stop)).toFixed(1) : '—';
    const tierBadge = c.tier==='中长线'?'<span class="badge b-tier-mid">中长线</span>':c.tier==='红利低波'?'<span class="badge b-tier-mid">红利低波</span>':c.tier==='波段'?'<span class="badge b-tier-swing">波段</span>':c.tier==='小市值'?'<span class="badge b-tier-short">小市值</span>':'<span class="badge b-tier-short">短线</span>';
    const dupTxt = c.dupN>=3?`<span class="badge b-buy" style="font-size:12px;padding:2px 7px;">多战法共振·${c.dupN}池</span>`:(c.dupN>=2?`<span class="badge b-tag" style="font-size:12px;padding:2px 7px;">双战法·${c.dupN}池</span>`:'');
    return `
    <div class="card" style="padding:0;" data-code="${c.code}" data-name="${c.name}" style="cursor:pointer;">
      <div class="card-hd">
        <span class="t"><span class="rank" style="min-width:26px;height:26px;line-height:26px;font-size:14px;">${i+1}</span>${c.name} <span style="font-size:12px;color:var(--text3);font-weight:600;">${c.code}</span> ${dupTxt} ${tierBadge}</span>
        <span class="meta">综合分 <span class="money" style="font-size:16px;color:var(--purple);">${c.total}</span> · PA <span class="money" style="font-size:16px;color:${c.pa>=70?'var(--up)':c.pa>=55?'var(--accent)':'var(--down)'};">${c.pa}</span></span>
      </div>

      <div class="card-bd">
        <div class="pos-row">
          <div class="pos-item"><div class="l">现价</div><div class="v ${cls(c.chg)}">${c.now!=null?c.now.toFixed(2):'—'} <span style="font-size:12px;">${fmtChg(c.chg)}</span></div></div>
          <div class="pos-item"><div class="l">买入区间</div><div class="v down" style="font-size:15px;">${c.buy!=null?(typeof c.buy==='string'?c.buy:c.buy.toFixed(2)):'—'}</div></div>
          <div class="pos-item"><div class="l">止盈区间</div><div class="v up" style="font-size:15px;">${c.target!=null?(typeof c.target==='string'?c.target:c.target.toFixed(2)):'—'}</div></div>
          <div class="pos-item"><div class="l">空间/盈亏比</div><div class="v">${upPct!=null?'+'+upPct+'%':'—'} <span style="font-size:12px;color:var(--text3);">RR ${rr}:1</span></div></div>

  return `

/* ===== 方案B：运行时技术指标+买点自动计算引擎 =====
 * 页面只上传一次、链接固定；每次打开页面自动拉取最新行情+日K，
 * 计算 MA20/MA60/60日高低位/MACD/KDJ/CCI/ADX/WR/量比/换手，
 * 并按池类型规则化生成 买点/目标/止损/位置/趋势/状态。
 * 数据源：腾讯 qt.gtimg.cn 实时（JSONP）+ web.ifzq.gtimg.cn 日K（qfq）
 * 口径：与 calc_ind.py 一致（MACD12/26/9, KDJ9/3/3, CCI14, ADX14, WR14）
 */
(function(){
  // ---------- 技术指标计算（纯函数） ----------
  function eA(arr,n){var k=2/(n+1),o=[],p=null;for(var i=0;i<arr.length;i++){var v=arr[i];p=(p==null)?v:v*k+p*(1-k);o.push(p);}return o;}
  function sA(arr,n){var o=[],s=0;for(var i=0;i<arr.length;i++){s+=arr[i];if(i>=n)s-=arr[i-n];o.push(i>=n-1?s/n:null);}return o;}
  function mMacd(c){var e12=eA(c,12),e26=eA(c,26),d=c.map(function(_,i){return e12[i]-e26[i];});var dea=eA(d,9);return +d[d.length-1].toFixed(2);}
  function mKdj(b){var n=9,k1=3,k2=3,K=50,D=50;for(var i=0;i<b.length;i++){var hh=-Infinity,ll=Infinity;for(var j=Math.max(0,i-n+1);j<=i;j++){if(b[j][3]>hh)hh=b[j][3];if(b[j][4]<ll)ll=b[j][4];}var r=(hh===ll)?50:(b[i][2]-ll)/(hh-ll)*100;K=(k1-1)/k1*K+(1/k1)*r;D=(k2-1)/k2*D+(1/k2)*K;}return +K.toFixed(1);}
  function mCci(b){var n=14,tp=b.map(function(x){return (x[3]+x[4]+x[2])/3;}),ma=sA(tp,n),last=tp.length-1,st=Math.max(0,last-n+1),md=0,cnt=0;for(var i=st;i<=last;i++){md+=Math.abs(tp[i]-ma[last]);cnt++;}md=md/cnt;if(md===0)return 0;return +((tp[last]-ma[last])/(0.015*md)).toFixed(1);}
  function mTr(b){var o=[];for(var i=0;i<b.length;i++){var h=b[i][3],l=b[i][4],pc=i>0?b[i-1][2]:b[i][2];o.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}return o;}
  function mAdx(b){var n=14,pd=[],md=[],tr=mTr(b);for(var i=1;i<b.length;i++){var up=b[i][3]-b[i-1][3],dn=b[i-1][4]-b[i][4];pd.push((up>dn&&up>0)?up:0);md.push((dn>up&&dn>0)?dn:0);}var len=pd.length,pdi=[],mdi=[],dx=[],atr=0,ps=0,ms=0;for(var i=0;i<len;i++){var t=tr[i+1];if(i<n-1){atr+=t;ps+=pd[i];ms+=md[i];continue;}if(i===n-1){atr=(atr+t)/n;ps=(ps+pd[i])/n;ms=(ms+md[i])/n;}else{atr=(atr*(n-1)+t)/n;ps=(ps*(n-1)+pd[i])/n;ms=(ms*(n-1)+md[i])/n;}var pv=atr>0?ps/atr*100:0,mv=atr>0?ms/atr*100:0;pdi.push(pv);mdi.push(mv);var su=pv+mv;dx.push(su>0?Math.abs(pv-mv)/su*100:0);}if(!dx.length)return 0;var ad=dx.slice(0,Math.min(n,dx.length)).reduce(function(a,b){return a+b;},0)/Math.min(n,dx.length);for(var i=n;i<dx.length;i++){ad=(ad*(n-1)+dx[i])/n;}return +ad.toFixed(1);}
  function mWr(b){var n=14,last=b.length-1,hh=-Infinity,ll=Infinity;for(var j=Math.max(0,last-n+1);j<=last;j++){if(b[j][3]>hh)hh=b[j][3];if(b[j][4]<ll)ll=b[j][4];}if(hh===ll)return 50;return +((hh-b[last][2])/(hh-ll)*100).toFixed(1);}
  function mMa(c,n){var last=c.length-1;if(last<n-1)return null;var s=0;for(var i=last-n+1;i<=last;i++)s+=c[i];return +(s/n).toFixed(2);}
  function techCalc(b){
    var c=b.map(function(x){return x[2];});
    var l60=Infinity,h60=-Infinity;
    for(var i=Math.max(0,b.length-60);i<b.length;i++){if(b[i][4]<l60)l60=b[i][4];if(b[i][3]>h60)h60=b[i][3];}
    var now=+c[c.length-1].toFixed(2);
    var p60=(h60===l60)?50:(now-l60)/(h60-l60)*100;

var _qq=[], _qa=0, _QMAX=3;
function _qrun(){
  if(!_qq.length||_qa>=_QMAX) return;
  var it=_qq.shift(); _qa++;
