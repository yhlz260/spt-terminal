    ctx.setLineDash([]);
    // 价格线平滑（Catmull-Rom → 二次贝塞尔）
    function smoothPath(pts){
      if(pts.length<2) return;
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=0;i<pts.length-1;i++){
        var p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
        var c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
        var c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
        ctx.bezierCurveTo(c1x,c1y,c2x,c2y,p2.x,p2.y);
      }
      ctx.stroke();
    }
    var pts=[], n=Math.min(ps.length,120);
    for(var i=0;i<ps.length;i++){
      var x=i/(ps.length-1)*W;
      var y=H-3-(ps[i]-mn)/(mx-mn)*(H-6);
      pts.push({x:x,y:y});
    }
    // 渐变填充
    var grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, col==='#e04848'?'rgba(224,72,72,.22)':'rgba(24,160,107,.22)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.moveTo(pts[0].x,H); 
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      ctx.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y);
    }
    ctx.lineTo(pts[pts.length-1].x,H); ctx.closePath(); ctx.fill();
    // 平滑价格线
    ctx.strokeStyle=col; ctx.lineWidth=1.3; ctx.lineJoin='round'; ctx.lineCap='round';
    smoothPath(pts);
    // 终点圆点
    var lp=pts[pts.length-1];
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(lp.x,lp.y,1.8,0,Math.PI*2); ctx.fill();
    // 涨跌幅标签（右上角）
    var pct=(ps[ps.length-1]/ps[0]-1)*100;
    var pctTxt=(pct>=0?'+':'')+pct.toFixed(1)+'%';
    ctx.fillStyle=col; ctx.font='8px sans-serif'; ctx.textAlign='right';
    ctx.fillText(pctTxt, W-2, 8);
    canvas.__sp=1;
  }).catch(function(){});
}
function seqEma(arr,n){ var k=2/(n+1),o=[arr[0]],e=arr[0]; for(var i=1;i<arr.length;i++){ e=arr[i]*k+e*(1-k); o.push(e);} return o; }
function seqMacd(closes){ var e12=seqEma(closes,12),e26=seqEma(closes,26); var dif=closes.map(function(_,i){return e12[i]-e26[i];}); var dea=seqEma(dif,9); return {dif:dif,dea:dea,macd:dif.map(function(d,i){return (d-dea[i])*2;})}; }
function seqKdj(bars){ var n=9,K=50,D=50,kv=[],dv=[],jv=[]; for(var i=0;i<bars.length;i++){ var hh=-Infinity,ll=Infinity; for(var j=Math.max(0,i-n+1);j<=i;j++){ if(bars[j][3]>hh)hh=bars[j][3]; if(bars[j][4]<ll)ll=bars[j][4]; } var r=(hh===ll)?50:(bars[i][2]-ll)/(hh-ll)*100; K=(2/3)*K+(1/3)*r; D=(2/3)*D+(1/3)*K; kv.push(+K.toFixed(2)); dv.push(+D.toFixed(2)); jv.push(+(3*K-2*D).toFixed(2)); } return {k:kv,d:dv,j:jv}; }
function seqMa(closes,n){ var o=[]; for(var i=0;i<closes.length;i++){ if(i<n-1){o.push(null);} else { var s=0; for(var j=i-n+1;j<=i;j++) s+=closes[j]; o.push(+(s/n).toFixed(2)); } } return o; }

// ---- 筹码峰（近120日成交量·三角形分布近似） ----
function chipDist(bars){
  var N=Math.min(120,bars.length), seg=50;
  var lo=Infinity,hi=-Infinity;
  for(var i=bars.length-N;i<bars.length;i++){ if(bars[i][3]>hi)hi=bars[i][3]; if(bars[i][4]<lo)lo=bars[i][4]; }
  if(hi-lo<1e-9) hi=lo+1;
  var step=(hi-lo)/seg, dist=new Array(seg).fill(0);
  for(var i=bars.length-N;i<bars.length;i++){
    var b=bars[i], o=b[1], c=b[2], h=b[3], l=b[4], v=b[5]||1;
    var sp=(h-l)||(c*0.01);
    var peak=c;
    for(var s=0;s<seg;s++){
      var price=lo+(s+0.5)*step;
      var w;
      if(price>=l&&price<=h){
        if(sp<1e-9){ w=1; }
        else { w=1-Math.abs(price-peak)/sp; w=Math.max(0,w); }
        dist[s]+=w*v;
      }
    }
  }
  var mx=Math.max.apply(null,dist); if(mx<1e-9) mx=1;
  var out=[]; for(var s=0;s<seg;s++){ out.push({price:+(lo+(s+0.5)*step).toFixed(2), pct:+(dist[s]/mx*100).toFixed(1)}); }
  return {lo:lo,hi:hi,dist:out};
}

/* ============================================================
   个股详情 · 新增分析维度（2026-09-15）
   补齐原版缺失的四块：仪表盘 / 持仓决策 / 缠论 / 信号雷达
   数据口径（全部与全站同源，不另造一套）：
     · 实时快照 = 腾讯 qt.gtimg.cn（fetchQtFields，GBK 安全解码）
     · 日K       = 腾讯前复权（fetchKlinePeriod，1 小时 dCache）
     · 技术指标 = window.techCalc（与全站技术引擎同一函数）
     · 池归属   = stockUniverse()（十池 + 三重仓三层）
     · 排雷     = FUNDAMENTAL_SCREEN + FUND_NAMES
   ============================================================ */
function dLive(){
  return fetchQtFields(dState.code).then(function(f){
    if(!f||f.length<50) return null;
    return {name:f[1], now:+f[3], prev:+f[4], open:+f[5], chgPct:+f[32], high:+f[33], low:+f[34],
      amt:(+f[37]||0)*1e4, turn:+f[38], pe:f[39], amp:+f[43], floatCap:+f[44], totalCap:+f[45],
      pb:f[46], upLimit:f[47], downLimit:f[48], vr:f[49]};
  }).catch(function(){ return null; });
}
function dDayTech(){
  return fetchKlinePeriod(dState.code,'day').then(function(bars){
    bars=bars||[];
    var ind=null;
    try{ if(typeof window.techCalc==='function' && bars.length>=30) ind=window.techCalc(bars); }catch(e){}
    return {bars:bars, ind:ind};
  }).catch(function(){ return {bars:[], ind:null}; });
}
function dPools(code){
  code=String(code||'').replace(/\D/g,''); var hits=[];
  try{ stockUniverse().forEach(function(s){ if(String(s.code).replace(/\D/g,'')===code) hits.push(s); }); }catch(e){}
  return hits;
}
function dCell(box,k,v,cl){ if(!box) return; box.insertAdjacentHTML('beforeend','<div class="fin-cell"><div class="k">'+k+'</div><div class="v" style="'+(cl||'')+'">'+v+'</div></div>'); }
function dPosObj(code){ try{ return findPosObj(String(code==null?'':code).replace(/\D/g,'')); }catch(e){ return null; } }
// 优先取「真正属于某个池」的条目作为主参考：stockUniverse 里只归到 '持仓' 的票说明它已不在任何池内
//（例如远东股份 600869 已从埋伏/波段池移出，只剩持仓）。有买点/目标信息的池条目优先。
function dPrimaryPool(code){
  var ps=dPools(code);
  if(!ps.length) return null;
  var i,s,tag;
  for(i=0;i<ps.length;i++){ s=ps[i]; tag=String(s._pool||s.pool||''); if(tag.indexOf('持仓')>=0) continue; if(buyZoneOf(s)||s.target!=null||s.stop!=null) return s; }
  for(i=0;i<ps.length;i++){ if(String(ps[i]._pool||ps[i].pool||'').indexOf('持仓')<0) return ps[i]; }
  return ps[0];
}
// 判断该标的的「池来源是否只有持仓」
function dOnlyHolding(code){ var ps=dPools(code); return ps.length>0 && ps.every(function(s){ return String(s._pool||s.pool||'').indexOf('持仓')>=0; }); }
function dScoreOf(ind, live, ps){
  try{
    var I=Object.assign({}, (ind||{}));
    if(ind && ind.p60!=null) I.pos60=ind.p60;
    var vr=null;
    if(live && live.vr!=null && live.vr!=='') vr=parseFloat(live.vr);
    if(!(vr>0) && ps){ var pi=ps.ind||ps.indicators||{}; if(pi.vr!=null) vr=parseFloat(pi.vr); if(ps.vr!=null) vr=parseFloat(ps.vr); }
    if(vr>0) I.vr=vr;
    if(live && live.turn!=null && isFinite(live.turn)) I.turnover=live.turn;
    return paScore({ind:I});
  }catch(e){ return null; }
}
function dRatingOf(sc){
  if(sc==null) return {t:'—', c:'var(--text3)'};
  if(sc>=78) return {t:'A · 结构健康', c:'var(--up)'};
  if(sc>=66) return {t:'B · 偏多观察', c:'var(--accent)'};
  if(sc>=52) return {t:'C · 中性', c:'var(--text2)'};
  return {t:'D · 结构偏弱', c:'var(--down)'};
}
// 构造 escapeSignals 需要的 p 对象（补 ind.vr / pos60 / pos30 / chg）
function dProbe(code, name, ind, live, ps){
  var q=ps; if(!q||!q.code){ try{ q=findAnyStock(code)||{}; }catch(e){ q={}; } }
  var I=Object.assign({}, (q.ind||q.indicators||{}), (ind||{}));
  if(ind){ I.pos60=ind.p60; I.pos30=ind.p30; }
  var vr=null;
  if(live && live.vr!=null && live.vr!=='') vr=parseFloat(live.vr);
  if(!(vr>0)){ var qi=q.ind||q.indicators||{}; if(qi.vr!=null) vr=qi.vr; if(q.vr!=null) vr=q.vr; }
  if(vr>0) I.vr=vr;
  var chg=(live && isFinite(live.chgPct))?live.chgPct:(parseFloat(q.chg)||0);
  return {code:String(code).replace(/\D/g,''), name:name||q.name||code, ind:I, chg:chg,
    pos:q.pos||'', p60:(ind?ind.p60:null), pos60:(ind?ind.p60:null), cci:(ind?ind.cci:null)};
}
// 详情页内建仓/加仓：任何代码都能用（含池外标的），同步写 state.positions + 交易流水
function dQuickBuy(code, shares, name, price, ps){
  var c6=String(code).replace(/\D/g,'');
  var q=ps; if(!q||!q.code){ try{ q=findAnyStock(c6)||{}; }catch(e){ q={}; } }
  var n=pAnyNum(shares); if(!(n>0)) n=1000;
  var px=pAnyNum(price); if(!(px>0)) px=pAnyNum(q.now);
  if(!(px>0)){ toast('取不到现价，无法建仓（可到「纪律审计」页手动录入持仓）'); return; }
  var nm=q.name||name||c6;
  var sp=findPosObj(c6);
  if(sp){
    var oldSh=pAnyNum(sp.shares)||0, oldCost=pAnyNum(sp.cost)||0, ns=oldSh+n;
    if(ns>0){ sp.cost=Math.round(((oldCost*oldSh+px*n)/ns)*100)/100; sp.shares=ns; }
    toast('已加仓：'+nm+' 持仓 '+ns+' 股 @'+sp.cost);
  } else {
    state.positions=state.positions||[];
    state.positions.push({code:c6, name:nm, cost:px, shares:n, now:px, chg:0, prevClose:px,
      ind:(q.ind||q.indicators||{}), pool:(q._pool||'详情页建仓')});
    toast('已建仓：'+nm+' '+n+' 股 @'+px);
    try{ recordRecommendation(c6, nm, px, [], (q._pool||''), (q._tier||'')); }catch(e){}
  }
  try{
    var tr=loadTrades();
    tr.push({d:ymdNow(), code:c6, name:nm, side:'buy', price:px, shares:n,
      pos60:(pAnyNum(q.pos60)!=null?pAnyNum(q.pos60):pAnyNum(q.p60)), pool:(q._pool||'详情页'), reason:'详情页「按现价买入」'});
    saveTrades(tr);
  }catch(e){}
  save();
  try{ render(true); }catch(e){}
}
function dQuickSell(code, shares, price){
  var c6=String(code).replace(/\D/g,'');
  var sp=findPosObj(c6);
  if(!sp){ toast('无该持仓'); return; }
  var cur=pAnyNum(sp.shares)||0; if(!(cur>0)){ toast('该持仓股数为 0'); return; }
  var n=pAnyNum(shares); if(!(n>0)) n=cur; n=Math.min(n,cur);
  var px=pAnyNum(price); if(!(px>0)){ toast('卖出价无效'); return; }
  var cost=pAnyNum(sp.cost)||0;
  var gain=cost>0?Math.round((px/cost-1)*1000)/10:null;
  var nm=sp.name||c6;
  try{
    var tr=loadTrades();
    tr.push({d:ymdNow(), code:c6, name:nm, side:'sell', price:px, shares:n,
      pos60:(pAnyNum(sp.pos60)!=null?pAnyNum(sp.pos60):null), pool:'详情页', reason:'详情页「卖出」', gain:gain});
    saveTrades(tr);
  }catch(e){}
  var left=cur-n;
  if(left>0) sp.shares=left;
  else state.positions=(state.positions||[]).filter(function(x){ return x!==sp; });
  save();
  toast('已卖出 '+nm+' '+n+' 股 @'+px+(gain!=null?('（'+(gain>0?'+':'')+gain+'%）'):''));
  try{ render(true); }catch(e){}
}

// ---------- ③ 缠论（简化：分型 → 笔 → 中枢 → 一/二/三买） ----------
function chanMerge(bars){
  var out=[];
  for(var i=0;i<bars.length;i++){
    var k={h:bars[i][3], l:bars[i][4], hi:i, lo:i, o:bars[i][1], c:bars[i][2]};
    if(!out.length){ out.push(k); continue; }
    var p=out[out.length-1];
    var inc=(k.h<=p.h && k.l>=p.l)||(k.h>=p.h && k.l<=p.l);
    if(!inc){ out.push(k); continue; }
    var up = (out.length>=2) ? (p.h>out[out.length-2].h) : true;
    if(up){ if(k.h>p.h){ p.h=k.h; p.hi=k.hi; } if(k.l>p.l){ p.l=k.l; p.lo=k.lo; } }
    else  { if(k.h<p.h){ p.h=k.h; p.hi=k.hi; } if(k.l<p.l){ p.l=k.l; p.lo=k.lo; } }
    p.c=k.c;
  }
  return out;
}
function chanFractals(m){
  var f=[];
  for(var i=1;i<m.length-1;i++){
    if(m[i].h>m[i-1].h && m[i].h>m[i+1].h) f.push({type:'top', mi:i, oi:m[i].hi, price:m[i].h});
    else if(m[i].l<m[i-1].l && m[i].l<m[i+1].l) f.push({type:'bot', mi:i, oi:m[i].lo, price:m[i].l});
  }
  return f;
}
function chanBi(fr){
  var bi=[], a=null;
  for(var k=0;k<fr.length;k++){
    var x=fr[k];
    if(!a){ a=x; continue; }
    if(x.type===a.type){
      if((x.type==='top'&&x.price>a.price)||(x.type==='bot'&&x.price<a.price)) a=x;
      continue;
    }
    if(x.mi-a.mi>=4){ bi.push([a,x]); a=x; }
    else if((x.type==='top'&&x.price>a.price)||(x.type==='bot'&&x.price<a.price)) a=x;
  }
  return bi;
}
function chanZhongShu(bi){
  if(bi.length<3) return null;
  var s3=bi.slice(-3).map(function(b){ return {hi:Math.max(b[0].price,b[1].price), lo:Math.min(b[0].price,b[1].price)}; });
  var zg=Math.min.apply(null,s3.map(function(x){ return x.hi; }));
  var zd=Math.max.apply(null,s3.map(function(x){ return x.lo; }));
  if(!(zg>zd)) return null;
  return {zg:zg, zd:zd, a:bi[bi.length-3][0].oi, b:bi[bi.length-1][1].oi};
}
function chanAnalysis(bars){
  var m=chanMerge(bars), fr=chanFractals(m), bi=chanBi(fr), zs=chanZhongShu(bi);
  var closes=bars.map(function(b){ return b[2]; });
  var macd=seqMacd(closes);
  var pts=[], tops=fr.filter(function(f){ return f.type==='top'; }), bots=fr.filter(function(f){ return f.type==='bot'; });
  // 一买：底背驰（价格新低、DIF 抬高）
  if(bots.length>=2){
    var b1=bots[bots.length-2], b2=bots[bots.length-1];
    if(b2.price<b1.price && macd.dif[b2.oi]>macd.dif[b1.oi])
      pts.push({k:'一买 · 底背驰', cls:'buy', desc:'价格创低 '+b2.price.toFixed(2)+'（前低 '+b1.price.toFixed(2)+'），但 DIF '+macd.dif[b2.oi].toFixed(3)+' 高于前低处 '+macd.dif[b1.oi].toFixed(3)+' → 下跌动能衰竭'});
  }
  // 二买：回调不破前低
  if(bots.length>=3){
    var c1=bots[bots.length-2], c2=bots[bots.length-1];
    if(c2.price>c1.price)
      pts.push({k:'二买 · 不破前低', cls:'buy', desc:'最近底 '+c2.price.toFixed(2)+' 高于前一底 '+c1.price.toFixed(2)+'，二买结构（一买后回调不破）'});
  }
  // 三买：站上中枢上沿后回踩不破
  if(zs && closes[closes.length-1]>zs.zg)
    pts.push({k:'三买 · 出中枢', cls:'buy', desc:'现价站上中枢上沿 '+zs.zg.toFixed(2)+'（中枢 '+zs.zd.toFixed(2)+'~'+zs.zg.toFixed(2)+'），中枢突破型买点'});
  // 顶背驰（一卖雏形）
  if(tops.length>=2){
    var t1=tops[tops.length-2], t2=tops[tops.length-1];
    if(t2.price>t1.price && macd.dif[t2.oi]<macd.dif[t1.oi])
      pts.push({k:'顶背驰 · 卖点雏形', cls:'sell', desc:'价格新高 '+t2.price.toFixed(2)+'，DIF '+macd.dif[t2.oi].toFixed(3)+' 反而低于前高 '+macd.dif[t1.oi].toFixed(3)+' → 上涨动能衰竭'});
  }
  return {m:m, fr:fr, bi:bi, zs:zs, pts:pts, macd:macd, tops:tops, bots:bots};
}
function renderChan(body){
  var c=null; try{ c=chartBase(body, true); }catch(e){ c=null; }   // ECharts CDN 不可达时不让整个 tab 挂掉
  body.insertAdjacentHTML('beforeend','<div class="sec-t">结构事实</div><div class="fin-grid" id="dChanFacts"></div>'
    +'<div class="sec-t">缠论买卖点</div><div id="dChanPts" style="display:flex;flex-direction:column;gap:6px;"></div>'
    +'<div class="dnote">简化缠论：K线包含关系合并 → 顶/底分型 → 笔（顶底交替、合并K线间隔≥4）→ 中枢（最近 3 笔的重叠区间）→ 一买(底背驰)/二买(不破前低)/三买(出中枢)/顶背驰。为工程近似实现，供结构参考，非严格缠论体系。</div>');
  fetchKlinePeriod(dState.code,'day').then(function(bars){
    if(!bars||bars.length<40){ body.insertAdjacentHTML('beforeend','<div class="dnote">日K数据不足（需 ≥40 根），无法做结构分析</div>'); return; }
    var res=chanAnalysis(bars);
    var N=Math.min(150,bars.length), from=bars.length-N, view=bars.slice(from);
    var dates=view.map(function(b){ return b[0]; });
    var ohlc=view.map(function(b){ return [b[1],b[2],b[4],b[3]]; });   // ECharts: [open, close, low, high]
    var closes=bars.map(function(b){ return b[2]; });
    var ma20=seqMa(closes,20).slice(from);
    var biPts=[];
    res.bi.forEach(function(seg){
      if(seg[0].oi>=from) biPts.push([bars[seg[0].oi][0], seg[0].price]);
      if(seg[1].oi>=from) biPts.push([bars[seg[1].oi][0], seg[1].price]);
    });
    var marks=res.fr.filter(function(f){ return f.oi>=from; }).slice(-10).map(function(f){
      return {coord:[bars[f.oi][0], f.price], value:(f.type==='top'?'顶':'底'), symbolSize:28,
        itemStyle:{color:(f.type==='top'?'#e04848':'#18a06b')}, label:{fontSize:9,color:'#fff'}};
    });
    var zs=res.zs, markArea=null;
    if(zs && zs.a>=from && zs.b>=from){
      markArea={silent:true,itemStyle:{color:'rgba(109,92,232,.10)',borderColor:'rgba(109,92,232,.5)',borderWidth:1},
        label:{show:true,position:'insideTop',formatter:'中枢 '+zs.zd.toFixed(2)+'~'+zs.zg.toFixed(2),color:'#6d5ce8',fontSize:10},
        data:[[{xAxis:bars[zs.a][0],yAxis:zs.zd},{xAxis:bars[zs.b][0],yAxis:zs.zg}]]};
    }
    try{
      c.setOption({
        backgroundColor:'transparent',
        tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
        legend:{data:['K线','MA20','笔'],textStyle:{fontSize:10},top:0},
        grid:{left:52,right:14,top:28,bottom:24},
        xAxis:{type:'category',data:dates,axisLabel:{fontSize:9,color:'#8b94ad',interval:Math.floor(dates.length/6)}},
        yAxis:{scale:true,axisLabel:{fontSize:9,color:'#8b94ad'},splitLine:{lineStyle:{color:'#e3e8f6'}}},
        series:[
          {name:'K线',type:'candlestick',data:ohlc,z:1,
            itemStyle:{color:'#e04848',color0:'#18a06b',borderColor:'#e04848',borderColor0:'#18a06b'},
            markPoint:{data:marks}, markArea:markArea||undefined},
          {name:'MA20',type:'line',data:ma20,smooth:true,showSymbol:false,z:2,lineStyle:{width:1,color:'#8b5cf6'}},
          {name:'笔',type:'line',data:biPts,showSymbol:false,z:6,lineStyle:{width:1.8,color:'#26365e'}}
        ]
      });
    }catch(e){ body.insertAdjacentHTML('beforeend','<div class="dnote">图表库未加载（ECharts CDN 不可达），仅显示结构文字与买卖点。</div>'); }
    // 结构事实
    var fb=document.getElementById('dChanFacts');
    dCell(fb,'合并后K线',res.m.length+' 根');
    dCell(fb,'分型数',res.fr.length+'（顶 '+res.tops.length+' / 底 '+res.bots.length+'）');
    dCell(fb,'笔数',res.bi.length);
    dCell(fb,'最后一个分型',res.fr.length?(res.fr[res.fr.length-1].type==='top'?'顶分型 '+res.fr[res.fr.length-1].price.toFixed(2):'底分型 '+res.fr[res.fr.length-1].price.toFixed(2)):'—');
    if(res.zs){
      var nowP=closes[closes.length-1];
      var inzs=(nowP>=res.zs.zd&&nowP<=res.zs.zg);
      dCell(fb,'中枢区间',res.zs.zd.toFixed(2)+' ~ '+res.zs.zg.toFixed(2));
      dCell(fb,'现价相对中枢',inzs?'中枢内部':(nowP>res.zs.zg?'中枢上方':'中枢下方'),'color:'+(nowP>res.zs.zg?'var(--up)':(inzs?'var(--accent)':'var(--down)')));
      dCell(fb,'中枢振幅',(((res.zs.zg-res.zs.zd)/res.zs.zd)*100).toFixed(2)+'%');
    } else {
      dCell(fb,'中枢','样本不足或未形成（需 ≥3 笔重叠）');
    }
    dCell(fb,'DIF / DEA',res.macd.dif[res.macd.dif.length-1].toFixed(3)+' / '+res.macd.dea[res.macd.dea.length-1].toFixed(3));
    // 买卖点
    var pb2=document.getElementById('dChanPts');

}

// ---------- 3. 市场 Regime · 双门校验 ----------
// A 门三指数：本地名称映射（2026-09-15 修复乱码）
// 根因：腾讯 qt.gtimg.cn 的响应头是 `Content-Type: text/html; charset=GBK`，返回体是 GBK 字节；
// 而 fetch().text() 恒按 UTF-8 解码（不理会 Content-Type 里的 charset）→ f[1] 的名称字段
// 解成 "ä¸Šè¯æŒ‡æ•°" 这类乱码。修法：① 取 arrayBuffer 用 TextDecoder('gbk') 解码；
// ② 名称一律走本地映射，彻底与编码解耦（即使解码器不可用也不会显示乱码）。
var IDX_NAME={'sh000001':'上证指数','sz399006':'创业板指','sh000688':'科创50'};
function decodeGBKText(buf){
  try{ return new TextDecoder('gbk').decode(buf); }
  catch(e){ try{ return new TextDecoder('utf-8').decode(buf); }catch(e2){ return ''; } }
}
// 腾讯个股实时快照（GBK 安全）：返回 '~' 切分后的字段数组，失败返回 null。
// 全站所有 qt.gtimg.cn 读取统一走这里，避免 fetch().text() 按 UTF-8 解 GBK 产生乱码。
function fetchQtFields(code){
  return fetch('https://qt.gtimg.cn/q='+dT(code),{headers:{'Referer':'https://gu.qq.com/'}})
    .then(function(r){ return r.arrayBuffer(); })
    .then(function(buf){
      var t=decodeGBKText(buf);
      var eq=t.indexOf('='); if(eq<0) return null;
      var q1=t.indexOf('"',eq), q2=t.lastIndexOf('"');
      if(q1<0||q2<=q1) return null;
      var f=t.slice(q1+1,q2).split('~');
      return f.length>3?f:null;
    })
    .catch(function(){ return null; });
}
function fetchIdxRealtime(){
  var codes=['sh000001','sz399006','sh000688'];
  return fetch('https://qt.gtimg.cn/q='+codes.join(','),{headers:{'Referer':'https://gu.qq.com/'}})
    .then(function(r){ return r.arrayBuffer(); })
    .then(function(buf){
      var txt=decodeGBKText(buf);
      var list=[], sum=0, n=0;
      codes.forEach(function(c){
        var m=txt.match(new RegExp('v_'+c+'="([^"]+)"')); if(!m) return;
        var f=m[1].split('~'); var now=parseFloat(f[3]), prev=parseFloat(f[4]);
        if(!(now>0)||!(prev>0)) return;
        var chg=(now-prev)/prev*100;
        var nm=IDX_NAME[c]||f[1]||c;
        if(new RegExp('[\\uFFFD]').test(nm)) nm=IDX_NAME[c]||c;   // 解码异常时的最后一道保险
        list.push({code:c,name:nm,val:now,chg:chg}); sum+=chg; n++;
      });

function toRet(k){ var r=[]; for(var i=1;i<k.length;i++){ var p=k[i-1].c; if(p>0) r.push({d:k[i].d,c:(k[i].c/p-1)*100}); } return r; }
function pearsonR(a,b){
  var m={}, xs=[], ys=[];
  a.forEach(function(x){ m[x.d]=x.c; });
  b.forEach(function(y){ if(m[y.d]!==undefined){ xs.push(m[y.d]); ys.push(y.c); } });
  var n=xs.length; if(n<15) return null;
  var mx=0,my=0,i;
  for(i=0;i<n;i++){ mx+=xs[i]; my+=ys[i]; }
  mx/=n; my/=n;
  var cov=0,vx=0,vy=0;
  for(i=0;i<n;i++){ var dx=xs[i]-mx, dy=ys[i]-my; cov+=dx*dy; vx+=dx*dx; vy+=dy*dy; }
  if(vx<=0||vy<=0) return null;
  return cov/Math.sqrt(vx*vy);
}

  <div class="kpi-row">

    <div class="kpi"><div class="l">最大单票权重</div><div class="v" style="font-size:20px;" id="pfKSingle">计算中…</div><div class="s">上限 ${POSITION_POLICY.singleCapPct}%</div></div>
    <div class="kpi"><div class="l">最大行业权重</div><div class="v" style="font-size:20px;" id="pfKIndW">计算中…</div><div class="s">上限 30%</div></div>
    <div class="kpi"><div class="l">数据覆盖</div><div class="v" style="font-size:20px;" id="pfKCov">计算中…</div><div class="s">K 线成功只数</div></div>
  </div>

    <div class="card-bd" id="pfPosBox"><div class="sig-empty">计算中…</div></div></div>

  <div class="card"><div class="card-hd"><div class="t">2 · 持仓权重与行业分布</div><div class="meta">按持仓市值占比 · 行业为手工归档</div></div>
    <div class="card-bd" id="pfWeightBox"><div class="sig-empty">计算中…</div></div></div>

  <div class="card"><div class="card-hd"><div class="t">3 · 持仓相关性（60 交易日日收益率）</div>
    <div class="meta"><button class="btn sm" onclick="fillPfRisk(true)" style="font-size:12px;padding:4px 12px;">重新计算</button></div></div>
    <div class="card-bd" id="pfCorrBox"><div class="sig-empty">计算中…</div></div>
    <div class="card-bd" style="border-top:1px solid var(--border);font-size:11.5px;color:var(--text3);line-height:1.7;">
      口径：腾讯前复权日K → 日收益率 → Pearson 相关系数。|ρ|≥0.6 视为高相关（同涨同跌，等于变相加仓同一风险）；样本不足 15 天不参与统计。
    </div>
  </div>

  <div class="card"><div class="card-hd"><div class="t">4 · 四项检查</div><div class="meta">通过 / 告警</div></div>
    <div class="card-bd" id="pfCheckBox"><div class="sig-empty">计算中…</div></div></div>

  <div class="disclaimer">相关性为前复权日收益率近似计算；行业分类为手工归档，未收录标的记为「未归类」。本页不构成投资建议。</div>`;
}
function fillPfRisk(force){
  var list=(state.positions&&state.positions.length)?state.positions:(typeof POSITIONS!=='undefined'?POSITIONS:[]);
  if(!list.length){ var b=document.getElementById('pfWeightBox'); if(b) b.innerHTML='<div class="sig-empty">暂无持仓</div>'; return; }
  var mv=list.map(function(p){ return {code:String(p.code).replace(/\D/g,''), name:p.name, shares:+p.shares||0, now:+p.now||0}; });
  var total=mv.reduce(function(s,p){ return s+p.shares*p.now; },0);
  mv.forEach(function(p){ p.w = total>0 ? (p.shares*p.now/total*100) : 0; p.ind=pfInd(p.code); });

  // 权重表
  var wb=document.getElementById('pfWeightBox');
  if(wb){
    wb.innerHTML='<table><thead><tr><th>标的</th><th>行业</th><th>市值</th><th>权重</th><th>单票上限校验</th></tr></thead><tbody>'
      + mv.map(function(p){
          var over=p.w>POSITION_POLICY.singleCapPct;
          return '<tr><td><b>'+p.name+'</b><br><span style="color:var(--text3);font-size:11px;">'+p.code+'</span></td>'
            +'<td>'+p.ind+'</td>'
            +'<td>'+fmtWan2(p.shares*p.now)+'</td>'
            +'<td style="font-weight:700;">'+p.w.toFixed(1)+'%</td>'
            +'<td>'+(over?'<span class="badge" style="background:rgba(224,72,72,.14);color:#b32b2b;">超上限</span>':'<span class="badge" style="background:rgba(52,199,123,.14);color:#1f9e63;">合规</span>')+'</td></tr>';
        }).join('')+'</tbody></table>';
  }
  // 行业权重
  var indW={}; mv.forEach(function(p){ indW[p.ind]=(indW[p.ind]||0)+p.w; });
  var maxInd=0, maxIndName='—', indCount=0;
  Object.keys(indW).forEach(function(k){ if(k!=='未归类') indCount++; if(indW[k]>maxInd){ maxInd=indW[k]; maxIndName=k; } });
  qs('pfKInd', indCount+' 个');
  qs('pfKSingle', (Math.max.apply(null,mv.map(function(p){return p.w;}))||0).toFixed(1)+'%');
  qs('pfKIndW', maxInd.toFixed(1)+'%');
  var pb=document.getElementById('pfPosBox');
  if(pb){
    var g=MARKET_GATE;
    pb.innerHTML='<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);">'
      +'<span>总仓上限 <b>'+g.totalCap+'</b>（'+g.regime+'）</span>'
      +'<span>层内分配 <b style="color:var(--purple);">'+POSITION_POLICY.mid.text+'</b> / <b style="color:var(--accent);">'+POSITION_POLICY.swing.text+'</b> / <b style="color:var(--up);">'+POSITION_POLICY.short.text+'</b></span>'
      +'<span>单票上限 <b>'+POSITION_POLICY.singleCapPct+'%</b>（短线 '+POSITION_POLICY.shortSingleCapPct+'%）</span>'
      +'<span>当前持仓市值合计 <b>'+fmtWan2(total)+'</b></span></div>';
  }

  // 相关性
  var cbox=document.getElementById('pfCorrBox');
  if(cbox){
    cbox.innerHTML='<div class="sig-empty">拉取日K 计算中…（'+mv.length+' 只）</div>';
    Promise.all(mv.map(function(p){
      return dF('https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+dT(p.code)+',day,,,70,qfq','https://gu.qq.com/')
        .then(function(j){
          var dd=j&&j.data&&j.data[dT(p.code)]; if(!dd) return null;
          var k=dd.qfqday||dd.day; if(!Array.isArray(k)||k.length<20) return null;
          return toRet(k.map(function(r){ return {d:String(r[0]),c:parseFloat(r[2])}; }).filter(function(x){return x.c>0;}));
        }).catch(function(){ return null; });
    })).then(function(all){
      var ok=0; all.forEach(function(a){ if(a) ok++; });
      qs('pfKCov', ok+' / '+mv.length);
      var pairs=[];
      for(var i=0;i<mv.length;i++){
        for(var j=i+1;j<mv.length;j++){
          if(!all[i]||!all[j]) continue;
          var r=pearsonR(all[i],all[j]);
          if(r==null) continue;
          pairs.push({a:mv[i],b:mv[j],r:r});
        }
      }
      pairs.sort(function(x,y){ return Math.abs(y.r)-Math.abs(x.r); });
      var high=pairs.filter(function(p){ return Math.abs(p.r)>=0.6; });
      var klineDown = (ok===0);
      qs('pfKCorr', klineDown?'不可用':(high.length+' 对'));
      if(klineDown){
        cbox.innerHTML='<div class="sig-empty" style="line-height:1.8;">日K 接口（web.ifzq.gtimg.cn）不可达，相关性无法计算。<br>'
          +'该接口同时也驱动本终端的「技术指标自动计算引擎」，若长期不可达，MA/MACD/CCI 等也会退回内嵌快照值。<br>'
          +'处理建议：换网络（非公司办公网）后点上方「重新计算」，或改用东财日K 作为备源。</div>';
      } else {
        cbox.innerHTML = pairs.length ? ('<table><thead><tr><th>标的 A</th><th>标的 B</th><th>相关系数 ρ</th><th>判定</th></tr></thead><tbody>'
          + pairs.map(function(p){
              var hi=Math.abs(p.r)>=0.6;
              return '<tr><td>'+p.a.name+'</td><td>'+p.b.name+'</td>'
                +'<td style="font-weight:700;color:'+(p.r>0?'var(--up)':'var(--down)')+'">'+p.r.toFixed(3)+'</td>'
                +'<td>'+(hi?'<span class="badge" style="background:rgba(224,72,72,.14);color:#b32b2b;">高相关</span>':'<span class="badge" style="background:rgba(52,199,123,.14);color:#1f9e63;">分散良好</span>')+'</td></tr>';
        }).join('')+'</tbody></table>')
        + (ok<mv.length?('<div style="font-size:11.5px;color:var(--text3);margin-top:8px;">注意：'+ok+'/'+mv.length+' 只取到日K，未取到的未参与统计。</div>'):'')
        : '<div class="sig-empty">样本不足，无法计算相关性（需要 ≥15 个交易日重叠）</div>';
      }

      // 四项检查
      var cb=document.getElementById('pfCheckBox');
      if(cb){
        function row(ok,txt,detail){
          return '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border);">'
            +'<span style="flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:'+(ok?'rgba(52,199,123,.15)':'rgba(224,138,30,.15)')+';color:'+(ok?'#1f9e63':'#c77f12')+';">'+(ok?'✓':'!')+'</span>'
            +'<div><b style="font-size:13px;">'+txt+'</b><div style="font-size:12px;color:var(--text2);margin-top:2px;">'+detail+'</div></div></div>';
        }
        var maxW=Math.max.apply(null,mv.map(function(p){return p.w;}));
        var undeclared=indW['未归类']||0;
        cb.innerHTML = row(true,'总仓位控制','当前持仓市值 '+fmtWan2(total)+'；择时门上限 '+MARKET_GATE.totalCap+'（'+MARKET_GATE.regime+'）')
          + row(indCount>=2, '行业分散检查', indCount+' 个已归类行业'+(undeclared>0?('，未归类占比 '+undeclared.toFixed(1)+'%（建议手工补全行业）'):'')
                + (indCount===1?'：集中于单一行业，建议分散':'：满足 ≥2 行业要求'))
          + row(high.length===0,'持仓相关性', pairs.length?('共 '+pairs.length+' 对，其中 |ρ|≥0.6 有 '+high.length+' 对'+(high.length?'（'+high.slice(0,3).map(function(p){return p.a.name+'/'+p.b.name;}).join('、')+'）':'')):'样本不足')
          + row(maxW<=POSITION_POLICY.singleCapPct,'最大单票权重', maxW.toFixed(1)+'% （上限 '+POSITION_POLICY.singleCapPct+'%）')
          + row(maxInd<=30,'最大行业权重', maxIndName+' '+maxInd.toFixed(1)+'% （上限 30%）');
      }
    });
  }
}
function qs(id,txt){ var el=document.getElementById(id); if(el) el.textContent=txt; }
</script>
